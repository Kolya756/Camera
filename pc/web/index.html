<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Камера-детектор</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
#stage{position:fixed;inset:0}
#c{width:100%;height:100%;object-fit:contain;display:block}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#hud{font:600 13px ui-monospace,Menlo,Consolas,monospace;color:#39ff7a;text-shadow:0 1px 3px #000;line-height:1.5;white-space:nowrap;min-width:0;flex:1 1 auto;overflow:hidden}
#hud div{overflow:hidden;text-overflow:ellipsis}
#modes{display:flex;background:rgba(15,15,15,.72);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px;pointer-events:auto;flex-shrink:0}
#modes button{background:transparent;border:0;color:#fff;border-radius:999px;padding:7px 12px;font:600 13px -apple-system,system-ui,Segoe UI,Roboto,sans-serif;touch-action:manipulation;cursor:pointer}
#modes button.on{background:#39ff7a;color:#000}
#rec{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);right:calc(env(safe-area-inset-right,0px) + 14px);display:flex;align-items:center;gap:7px;font:700 13px ui-monospace,Menlo,Consolas,monospace;color:#ff4d4d;text-shadow:0 1px 3px #000;pointer-events:none}
#rec i{width:10px;height:10px;border-radius:50%;background:#ff4d4d;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;padding:0 12px}
.btn{background:rgba(15,15,15,.72);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:12px 18px;font:600 15px -apple-system,system-ui,Segoe UI,Roboto,sans-serif;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.btn:disabled{opacity:.45}
#record{min-width:96px}
#record.live{background:#ff4d4d;border-color:#ff4d4d}
#shot{width:68px;height:68px;border-radius:50%;background:#fff;border:4px solid rgba(0,0,0,.55);box-shadow:0 0 0 3px rgba(255,255,255,.85);padding:0}
#shot:active{transform:scale(.92)}
#save{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:rgba(15,15,15,.9);border:1px solid rgba(255,255,255,.3);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px)}
#save span{font-size:14px;white-space:nowrap}
#save .btn{padding:10px 14px}
#diag{position:fixed;left:calc(env(safe-area-inset-left,0px) + 8px);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);margin:0;font:11px ui-monospace,Menlo,Consolas,monospace;color:#9f9;background:rgba(0,0,0,.6);padding:6px 8px;border-radius:8px;white-space:pre-wrap;max-width:70%;pointer-events:none}
#panel{position:fixed;left:calc(env(safe-area-inset-left,0px) + 10px);bottom:calc(env(safe-area-inset-bottom,0px) + 96px);max-width:min(78vw,340px);background:rgba(10,12,16,.82);border:1px solid rgba(57,255,122,.35);border-radius:10px;font:12px ui-monospace,Menlo,Consolas,monospace;color:#d8ffe6;line-height:1.45;overflow:hidden}
#panel .ph{display:flex;align-items:center;gap:8px;padding:7px 10px;cursor:pointer;white-space:nowrap}
#panel .ph b{color:#39ff7a;letter-spacing:.06em}
#panel .ph span{opacity:.9}
#panel .pb{display:none;padding:0 10px 9px;border-top:1px solid rgba(255,255,255,.12)}
#panel.open .pb{display:block}
#panel .row{display:flex;flex-wrap:wrap;gap:6px;margin-top:7px}
#panel .sm{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;border-radius:999px;padding:5px 9px;font:600 12px -apple-system,system-ui,Segoe UI,Roboto,sans-serif;touch-action:manipulation;cursor:pointer}
#panel .sm.on{background:#39ff7a;color:#000;border-color:#39ff7a}
#panel .sm.edit{background:#ffcc33;color:#000;border-color:#ffcc33}
#panel .list{margin-top:6px;white-space:pre-wrap}
#editHint{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 58px);transform:translateX(-50%);background:rgba(255,204,51,.92);color:#000;border-radius:999px;padding:6px 12px;font:600 13px -apple-system,system-ui,Segoe UI,Roboto,sans-serif;pointer-events:none}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(15,15,15,.88);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:12px 16px;font-size:14px;max-width:80%;text-align:center;pointer-events:none;line-height:1.4}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#000;text-align:center;padding:24px}
#start h1{margin:0;font:700 22px ui-monospace,Menlo,Consolas,monospace;color:#39ff7a;letter-spacing:.04em}
#msg{opacity:.8;font-size:14px;max-width:320px;line-height:1.45}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<video id="v" playsinline muted autoplay></video>
<div id="flash"></div>
<div id="top" hidden>
<div id="hud"><div id="cnt"></div><div id="perf"></div></div>
<div id="modes"><button data-mode="person" class="on">Люди</button><button data-mode="animal">Животные</button><button data-mode="all">Все</button></div>
</div>
<div id="rec" hidden><i></i><span id="recT">00:00</span></div>
<div id="bar" hidden><button id="record" class="btn">Запись</button><button id="shot" class="btn" aria-label="Фото"></button><button id="flip" class="btn">Сменить</button></div>
<div id="panel" hidden><div class="ph" id="panelHead"><b>AI</b><span id="panelSum"></span></div><div class="pb"><div class="row"><button class="sm" id="fxTrails">Траектории</button><button class="sm" id="fxLabels">Подписи</button><button class="sm" id="fxZones">Зоны и линии</button></div><div class="row"><button class="sm" id="addZone">+ Зона</button><button class="sm" id="addLine">+ Линия</button><button class="sm" id="clearAll">Стереть</button></div><div class="list" id="panelList"></div></div></div>
<div id="editHint" hidden></div>
<div id="save" hidden><span id="saveMsg"></span><button id="saveBtn" class="btn">Сохранить</button><button id="discardBtn" class="btn">✕</button></div>
<div id="toast" hidden></div>
<pre id="diag" hidden></pre>
<div id="start">
<h1>DETECT CAM</h1>
<div id="msg">Камера находит людей и животных и обводит каждого рамкой. Фото и видео сохраняются вместе с рамками.</div>
<button id="go" class="btn">Включить камеру</button>
</div>
<script type="module">
const ORT='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/';
const PARAMS=new URLSearchParams(location.search);
let PCMODE=false;PCMODE=true;
const ISO=!!window.crossOriginIsolated&&typeof SharedArrayBuffer!=='undefined';
const THREADS=Math.max(1,Math.min(4,parseInt(PARAMS.get('threads'))||(ISO?Math.min(4,(navigator.hardwareConcurrency||2)-1):1)));
let started=false,swOff=false;
try{swOff=localStorage.getItem('nosw')==='1';}catch(e){}
const SW_OK=!PCMODE&&'serviceWorker' in navigator&&location.protocol!=='file:'&&!PARAMS.has('nosw')&&!swOff;
if(SW_OK&&!ISO){
  navigator.serviceWorker.register('coi-serviceworker.js').then(()=>navigator.serviceWorker.ready).then(()=>{
    let done=false;
    try{done=sessionStorage.getItem('coi')==='1';sessionStorage.setItem('coi','1');}catch(e){}
    if(!done&&!started&&!navigator.serviceWorker.controller)location.reload();
  }).catch(()=>{});
}
async function dropSw(){
  try{localStorage.setItem('nosw','1');const rs=await navigator.serviceWorker.getRegistrations();for(const r of rs)await r.unregister();}catch(e){}
}
const MODELS={n512:{name:'n',size:512,file:'n512p'},n640:{name:'n',size:640,file:'n640p'},nrect:{name:'n',size:512,rect:1,file:'nrect'},s416:{name:'s',size:416,file:'s416p'},s512:{name:'s',size:512,file:'s512p'},srect:{name:'s',size:512,rect:1,file:'srect'}};
let MKEY='nrect',SIZE=512;
const MVER='v5';
const RECT=[384,672];
const PACE=!PCMODE&&PARAMS.get('pace')!=='0';
const VERIFY_ON=PARAMS.get('verify')==='1';
const VERIFY_MIN=parseInt(PARAMS.get('vmin'))||120,VERIFY_LUMA=parseInt(PARAMS.get('vluma'))||50;
const ANIMAL_IDX=[[7,24],[80,100],[127,146],[151,299],[339,353],[385,386],[850,850]];
const CAT_IDX=[281,285],DOG_IDX=[151,268];
let verifyOk=false,verifyId=0,verifyBusy=false;
const REC_STAT=PARAMS.has('debug')?[]:null;
const vc=document.createElement('canvas');
const vctx=vc.getContext('2d',{willReadFrequently:true});
const SLOW_MS=300,FAST_MS=200,S_MS=450;
const FOCUS=!new URLSearchParams(location.search).has('nofocus');
function modelUrl(k){const m=MODELS[k];return new URL('model_'+m.file+'.onnx',location.href).href;}
function inputDims(k,vw,vh){const m=MODELS[k];if(!m.rect)return [m.size,m.size];return vw<vh?[RECT[0],RECT[1]]:[RECT[1],RECT[0]];}
function setModel(k){MKEY=k;SIZE=MODELS[k].size;}
const COCO=['person','bicycle','car','motorcycle','airplane','bus','train','truck','boat','traffic light','fire hydrant','stop sign','parking meter','bench','bird','cat','dog','horse','sheep','cow','elephant','bear','zebra','giraffe','backpack','umbrella','handbag','tie','suitcase','frisbee','skis','snowboard','sports ball','kite','baseball bat','baseball glove','skateboard','surfboard','tennis racket','bottle','wine glass','cup','fork','knife','spoon','bowl','banana','apple','sandwich','orange','broccoli','carrot','hot dog','pizza','donut','cake','chair','couch','potted plant','bed','dining table','toilet','tv','laptop','mouse','remote','keyboard','cell phone','microwave','oven','toaster','sink','refrigerator','book','clock','vase','scissors','teddy bear','hair drier','toothbrush'];
const ANIMALS=['bird','cat','dog','horse','sheep','cow','elephant','bear','zebra','giraffe'];
const CLASSES=['person',...ANIMALS];
const RU={person:'ЧЕЛОВЕК',bird:'ПТИЦА',cat:'КОШКА',dog:'СОБАКА',horse:'ЛОШАДЬ',sheep:'ОВЦА',cow:'КОРОВА',elephant:'СЛОН',bear:'МЕДВЕДЬ',zebra:'ЗЕБРА',giraffe:'ЖИРАФ'};
const KEEP_SCORE=0.15;
const LABEL={wgpu:'GPU',mgpu:'GPU·',wcpu:'CPU',main:'CPU·',fake:'TEST',pc:'ПК'};
const AFTER={wgpu:['mgpu','wcpu','main'],mgpu:['wcpu','main'],wcpu:['main'],main:[],fake:[],pc:[]};
const WANT=COCO.map(c=>CLASSES.includes(c)?c:(c==='teddy bear'?'dog':''));
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const ANDROID_CHROME=/Android/.test(navigator.userAgent)&&/Chrome\/\d/.test(navigator.userAgent)&&!/EdgA|SamsungBrowser|MiuiBrowser|OPR|YaBrowser|UCBrowser/.test(navigator.userAgent);
const PET_LABEL=new Set(['dog','cat','bird']);
function labelOf(t){return (t.cls!=='person'&&!PET_LABEL.has(t.cls)&&t.peak<0.6)?'ЖИВОТНОЕ':(RU[t.cls]||t.cls.toUpperCase());}
let gpuTrial=false,gpuPending=false;
try{gpuTrial=localStorage.getItem('gpu-trial')!==null;}catch(e){}
function markGpu(on){gpuPending=on;try{if(on)localStorage.setItem('gpu-trial','1');else localStorage.removeItem('gpu-trial');}catch(e){}}

const $=id=>document.getElementById(id);
const video=$('v'),canvas=$('c'),ctx=canvas.getContext('2d');
const top=$('top'),cnt=$('cnt'),perf=$('perf'),modes=$('modes'),rec=$('rec'),recT=$('recT');
const bar=$('bar'),record=$('record'),shot=$('shot'),flip=$('flip');
const save=$('save'),saveMsg=$('saveMsg'),saveBtn=$('saveBtn'),discardBtn=$('discardBtn');
const diagEl=$('diag'),toastEl=$('toast'),flash=$('flash'),startScreen=$('start'),msg=$('msg'),go=$('go');
const fc=document.createElement('canvas');
const fctx=fc.getContext('2d',{willReadFrequently:true});
const gc=document.createElement('canvas');
const gctx=gc.getContext('2d',{willReadFrequently:true});
const clean=document.createElement('canvas');
const cctx=clean.getContext('2d',{willReadFrequently:true});

let stream=null,facing='environment',mode='person',running=false;
let detectors=[],kind='';
const POOL=Math.max(1,Math.min(3,parseInt(PARAMS.get('workers'))||((THREADS>1||IOS)?1:(((navigator.hardwareConcurrency||2)>=4&&(navigator.deviceMemory||8)>=4)?2:1))));
let threads=1;
let lastTs=0,inferMs=0,cleanTs=0,ageMs=0,detN=0,detRate=0,detT=0,camN=0,camFps=0,recN=0,recFps=0;
let frameWaiters=[],lastClaimTs=0,lastClaimAt=0;
function nextFrame(){return new Promise(r=>{if(frameWaiters.length>32)frameWaiters.shift()();frameWaiters.push(r);});}
async function claimFrame(det){
  for(;;){
    if(!running)return false;
    const now=performance.now();
    const n=detectors.length||1;
    const stagger=n>1&&inferMs?inferMs/n-(now-lastClaimAt):0;
    const rest=PACE&&inferMs&&fps>0?(fps<30?inferMs*0.75:fps<45?inferMs*0.35:0)-(now-(det.doneAt||0)):0;
    const wait=Math.max(stagger,rest);
    if(wait>0){await sleep(Math.min(wait,50));continue;}
    if(cleanTs<=lastClaimTs){await Promise.race([nextFrame(),sleep(100)]);continue;}
    lastClaimTs=cleanTs;lastClaimAt=performance.now();return true;
  }
}
let fps=0,fpsN=0,fpsT=0,lastFrame=0,lastStep=0,newFrame=true,lastVF=0,vfc=false,cntText='',perfText='';
function armVF(){if(vfc||typeof video.requestVideoFrameCallback!=='function')return;vfc=true;video.requestVideoFrameCallback(()=>{vfc=false;newFrame=true;camN++;armVF();});}
let toastTimer=null,diagT=0;
const DIAG=new URLSearchParams(location.search).has('diag');
let glInfo='';
try{const g=document.createElement('canvas').getContext('webgl');const e=g&&g.getExtension('WEBGL_debug_renderer_info');glInfo=e?g.getParameter(e.UNMASKED_RENDERER_WEBGL):'';}catch(e){}
function diagText(now){
  if(kind==='pc')return 'UA: '+navigator.userAgent.slice(0,90)+'\nрежим: ПК '+(pc.info?pc.info.device+' · '+pc.info.model+(pc.info.half?' fp16':''):'-')+'  связь '+(pc.up?'есть':'нет')+'  кадр '+pcDims(clean.width,clean.height).join('×')+' '+Math.round(pc.kb)+' КБ  видео '+video.videoWidth+'×'+video.videoHeight+'\nзадержка рамок '+Math.round(ageMs)+' мс  туда-обратно '+Math.round(pc.rtt)+' мс  на ПК '+Math.round(pc.srv)+' мс  сжатие '+Math.round(pc.enc)+' мс  потеряно '+pc.lost+'\nдетекций/с '+detRate.toFixed(1)+'  FPS экрана '+Math.round(fps)+'  камеры '+Math.round(camFps)+'  записи '+Math.round(recFps)+'  треков '+tracker.tracks.length;
  return 'UA: '+navigator.userAgent.slice(0,90)+'\nядра: '+(navigator.hardwareConcurrency||'?')+'  память: '+(navigator.deviceMemory||'?')+' ГБ  GPU: '+(glInfo||'?')+'  WebGPU: '+(navigator.gpu?'да':'нет')+'\nрежим: '+LABEL[kind]+'×'+detectors.length+' потоков '+threads+' изоляция '+(ISO?'да':'нет')+' модель '+MODELS[MKEY].name+' вход '+inputDims(MKEY,clean.width,clean.height).join('×')+'  видео '+video.videoWidth+'×'+video.videoHeight+'\nинференс '+Math.round(inferMs)+' мс  детекций/с '+detRate.toFixed(1)+'  возраст кадра при результате '+Math.round(ageMs)+' мс\nFPS экрана '+Math.round(fps)+'  камеры '+Math.round(camFps)+'  записи '+Math.round(recFps)+'  треков '+tracker.tracks.length;
}
if(DIAG)diagEl.hidden=false;

try{const m=localStorage.getItem('mode');if(m==='person'||m==='animal'||m==='all')mode=m;const f=localStorage.getItem('facing');if(f==='user'||f==='environment')facing=f;}catch(e){}

const YOLO_LIB=`
function iou(a,b){const x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]),x2=Math.min(a[0]+a[2],b[0]+b[2]),y2=Math.min(a[1]+a[3],b[1]+b[3]);const i=Math.max(0,x2-x1)*Math.max(0,y2-y1);const u=a[2]*a[3]+b[2]*b[3]-i;return u>0?i/u:0;}
function nms(dets,thr){dets.sort((a,b)=>b.score-a.score);const out=[];for(const d of dets){let ok=true;for(const o of out){if(o.cls===d.cls&&iou(o.box,d.box)>thr){ok=false;break;}}if(ok)out.push(d);}return out;}
function decode(out,names,thr,size){
  const o=out[Object.keys(out)[0]];const rows=o.dims[1],N=o.dims[2],d=o.data;const dets=[];
  if(N===6){
    for(let i=0;i<rows;i++){const b=i*6,sc=d[b+4];if(sc<thr||!names[d[b+5]|0])continue;dets.push({cls:names[d[b+5]|0],score:sc,box:[d[b],d[b+1],d[b+2]-d[b],d[b+3]-d[b+1]]});}
    return nms(dets,0.6);
  }
  for(let i=0;i<N;i++){
    let best=-1,bs=0;
    for(let k=4;k<rows;k++){const v=d[k*N+i];if(v>bs){bs=v;best=k-4;}}
    if(bs<thr||!names[best])continue;
    const cx=d[i],cy=d[N+i],w=d[2*N+i],h=d[3*N+i];
    dets.push({cls:names[best],score:bs,box:[cx-w/2,cy-h/2,w,h]});
  }
  return nms(dets,0.45);
}
function tensor(px,w,h){const n=w*h;const f=new Float32Array(3*n);for(let i=0,j=0;i<n;i++,j+=4){f[i]=px[j]/255;f[n+i]=px[j+1]/255;f[2*n+i]=px[j+2]/255;}return f;}`;

const workerSrc=lib=>`
importScripts('${ORT}${lib}');
ort.env.wasm.wasmPaths='${ORT}';
ort.env.wasm.numThreads=${THREADS};
${YOLO_LIB}
let session=null,names=null,size=0,input='',u8=true,cls=null,clsIn='';
function sumRange(p,a,b){let s=0;for(let i=a;i<=b;i++)s+=p[i];return s;}
self.onmessage=async e=>{
  const m=e.data;
  if(m.type==='init'){
    try{
      names=m.names;size=m.size;u8=true;
      if(m.eps[0]==='webgpu'&&!(self.navigator&&self.navigator.gpu))throw new Error('нет WebGPU в воркере');
      session=await ort.InferenceSession.create(m.model,{executionProviders:m.eps});
      input=session.inputNames[0];
      if(m.cls){try{cls=await ort.InferenceSession.create(m.cls,{executionProviders:m.eps});clsIn=cls.inputNames[0];}catch(e2){cls=null;}}
      self.postMessage({type:'ready',threads:ort.env.wasm.numThreads,cls:!!cls});
    }catch(err){self.postMessage({type:'error',message:String(err&&err.message||err)});}
    return;
  }
  if(m.type==='verify'){
    try{
      const o=await cls.run({[clsIn]:new ort.Tensor('uint8',new Uint8Array(m.buf),[1,224,224,4])});
      const p=o[Object.keys(o)[0]].data;
      let top=0;for(let i=1;i<p.length;i++)if(p[i]>p[top])top=i;
      const R=${JSON.stringify([[7,24],[80,100],[127,146],[151,299],[339,353],[385,386],[850,850]])};
      let animal=0;for(const [a,b] of R)animal+=sumRange(p,a,b);
      self.postMessage({type:'verified',id:m.id,tid:m.tid,animal,dog:sumRange(p,151,268),cat:sumRange(p,281,285),top,topP:p[top],topAnimal:R.some(([a,b])=>top>=a&&top<=b)});
    }catch(err){self.postMessage({type:'verified',id:m.id,tid:m.tid,error:String(err&&err.message||err)});}
    return;
  }
  if(m.type==='frame'){
    try{
      const t0=performance.now();
      let out;
      if(u8){try{out=await session.run({[input]:new ort.Tensor('uint8',new Uint8Array(m.buf),[1,m.h,m.w,4])});}catch(e1){u8=false;}}
      if(!u8)out=await session.run({[input]:new ort.Tensor('float32',tensor(new Uint8ClampedArray(m.buf),m.w,m.h),[1,3,m.h,m.w])});
      self.postMessage({type:'result',dets:decode(out,names,${KEEP_SCORE},size),ms:performance.now()-t0});
    }catch(err){self.postMessage({type:'error',message:String(err&&err.message||err)});}
  }
};`;

function workerDetector(eps,mk,lib){
  const size=MODELS[mk].size;
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(new Blob([workerSrc(lib)],{type:'text/javascript'}));
    let w;
    try{w=new Worker(url);}catch(e){reject(e);return;}
    let pending=null,ready=false;
    const vjobs=new Map();
    const fail=err=>{w.terminate();if(pending){const p=pending;pending=null;p.reject(err);}for(const j of vjobs.values())j.reject(err);vjobs.clear();if(!ready)reject(err);};
    const timer=setTimeout(()=>fail(new Error('время ожидания вышло')),180000);
    w.onerror=ev=>{clearTimeout(timer);fail(new Error(ev.message||'ошибка воркера'));};
    w.onmessage=ev=>{

async function mainDetector(mk,eps){

async function createDetector(){

  }
  const params=new URLSearchParams(location.search);
  const forcedModel=MODELS[params.get('model')]?params.get('model'):'';
  const force=params.get('backend');
  if(force&&KINDS[force]){kind=force;setModel(forcedModel||'nrect');return KINDS[force](MKEY);}
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem('backend')||'null');}catch(e){}
  if(!forcedModel&&saved&&saved.ver===MVER&&KINDS[saved.kind]&&MODELS[saved.model]&&!((saved.kind==='wgpu'||saved.kind==='mgpu')&&gpuTrial)){
    setModel(saved.model);

    try{const d=await KINDS[saved.kind](MKEY);kind=saved.kind;return d;}catch(e){}
  }
  setModel(forcedModel||'nrect');

  if(tries[0]==='wgpu')markGpu(true);

    const base={model:MKEY,d:best.d,ms:best.ms};

    for(const cand of cands){
      let d2=null,ms2=Infinity;

}

function focusRoi(vw,vh){
  const small=tracker.tracks.filter(t=>t.box[3]<0.15*vh&&(visible(t)||(t.small&&t.hits<2&&modeOk(t))));
  let cx=vw/2,cy=vh/2;
  if(small.length){
    let x1=Infinity,y1=Infinity,x2=-Infinity,y2=-Infinity;
    for(const t of small){x1=Math.min(x1,t.box[0]);y1=Math.min(y1,t.box[1]);x2=Math.max(x2,t.box[0]+t.box[2]);y2=Math.max(y2,t.box[1]+t.box[3]);}
    cx=(x1+x2)/2;cy=(y1+y2)/2;
  }else{
    const spots=[[0.5,0.5],[0.3,0.3],[0.7,0.3],[0.5,0.3],[0.3,0.6],[0.7,0.6]];
    const sp=spots[sweep++%spots.length];cx=vw*sp[0];cy=vh*sp[1];
  }
  const rw=vw/2,rh=vh/2;
  const x=Math.max(0,Math.min(vw-rw,cx-rw/2)),y=Math.max(0,Math.min(vh-rh,cy-rh/2));

  function iou(a,b){const i=interArea(a,b);const u=a[2]*a[3]+b[2]*b[3]-i;return u>0?i/u:0;}
  function inside(a,b){const aa=a[2]*a[3];return aa>0?interArea(a,b)/aa:0;}
  function covered(t,b,roi){
    if(!roi)return !t.small;
    const m=0.04;
    return inside(b,[roi[0]+roi[2]*m,roi[1]+roi[3]*m,roi[2]*(1-2*m),roi[3]*(1-2*m)])>=0.95;
  }

  function sad(prev,cur,w,x,y,bw,bh,dx,dy,st){
    let s=0;
    for(let j=0;j<bh;j+=st){
      const r0=(y+j)*w+x,r1=(y+j+dy)*w+x+dx;
      for(let i=0;i<bw;i+=st)s+=Math.abs(prev[r0+i]-cur[r1+i]);
    }
    return s;
  }
  function texture(g,w,x,y,bw,bh,st){
    let n=0,sum=0;
    for(let j=0;j<bh;j+=st){const r=(y+j)*w+x;for(let i=0;i<bw;i+=st){sum+=g[r+i];n++;}}
    const m=sum/n;let d=0;
    for(let j=0;j<bh;j+=st){const r=(y+j)*w+x;for(let i=0;i<bw;i+=st)d+=Math.abs(g[r+i]-m);}
    return d/n;
  }
  function sub(a,b,c){const d=2*Math.max(a-b,c-b);return d>0?Math.max(-1,Math.min(1,(a-c)/d)):0;}

  function match(prev,cur,w,h,x,y,bw,bh,cx,cy,R,st){
    x=Math.round(x);y=Math.round(y);bw=Math.round(bw);bh=Math.round(bh);
    const lim=R+Math.max(Math.abs(cx),Math.abs(cy));
    if(x<lim){bw-=lim-x;x=lim;}
    if(y<lim){bh-=lim-y;y=lim;}
    if(x+bw>w-lim)bw=w-lim-x;
    if(y+bh>h-lim)bh=h-lim-y;
    if(bw<4||bh<4)return null;
    const tex=texture(prev,w,x,y,bw,bh,st);
    if(tex<2.5)return null;
    const n=2*R+1,S=new Float64Array(n*n);
    let best=Infinity,bi=0,bj=0;
    for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){
      const v=sad(prev,cur,w,x,y,bw,bh,cx+i,cy+j,st);
      S[(j+R)*n+(i+R)]=v;
      if(v<best){best=v;bi=i;bj=j;}
    }
    let fx=0,fy=0;
    const c=(bj+R)*n+(bi+R);
    if(bi>-R&&bi<R)fx=sub(S[c-1],S[c],S[c+1]);
    if(bj>-R&&bj<R)fy=sub(S[c-n],S[c],S[c+n]);
    return {dx:cx+bi+fx,dy:cy+bj+fy,sad:best,q:best/(Math.ceil(bw/st)*Math.ceil(bh/st))/tex};
  }

  function region(b){
    const s=T.scale;
    const bw=b[2]*0.6/s,bh=b[3]*0.8/s;
    const a=bw*bh;
    return {x:(b[0]+b[2]*0.2)/s,y:(b[1]+b[3]*0.1)/s,bw,bh,st:a>6000?3:a>1500?2:1};
  }

  function radius(base,dt,cap){return Math.min(cap,Math.max(base,Math.ceil(base*dt/33)));}

  function patchOf(b){
    const s=T.scale;
    let x=Math.round((b[0]+b[2]*0.2)/s),y=Math.round((b[1]+b[3]*0.1)/s),bw=Math.round(b[2]*0.6/s),bh=Math.round(b[3]*0.8/s);
    if(x<1){bw-=1-x;x=1;}
    if(y<1){bh-=1-y;y=1;}
    if(x+bw>T.w-1)bw=T.w-1-x;
    if(y+bh>T.h-1)bh=T.h-1-y;
    if(bw<3||bh<3)return null;
    const a=bw*bh;
    return {x,y,bw,bh,st:a>6000?3:a>1500?2:1};
  }
  function capture(t,g){
    const p=patchOf(t.pos);
    if(!p){t.ref=null;return;}
    const buf=new Uint8Array(Math.ceil(p.bw/p.st)*Math.ceil(p.bh/p.st));
    let k=0,sum=0;
    for(let j=0;j<p.bh;j+=p.st){const r=(p.y+j)*T.w+p.x;for(let i=0;i<p.bw;i+=p.st){const v=g[r+i];buf[k++]=v;sum+=v;}}
    const m=sum/k;let d=0;
    for(let i=0;i<k;i++)d+=Math.abs(buf[i]-m);
    t.ref={g:buf,m,tex:Math.max(2.5,d/k),bw:p.bw,bh:p.bh,st:p.st};
  }
  function refQ(t,g){
    const r=t.ref,p=patchOf(t.pos);
    if(!r||!p||p.bw!==r.bw||p.bh!==r.bh||p.st!==r.st)return -1;
    let best=Infinity;
    for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){
      const x=p.x+dx,y=p.y+dy;
      if(x<0||y<0||x+p.bw>T.w||y+p.bh>T.h)continue;
      let sum=0,k=0;
      for(let j=0;j<p.bh;j+=p.st){const row=(y+j)*T.w+x;for(let i=0;i<p.bw;i+=p.st){sum+=g[row+i];k++;}}
      const m=sum/k;let d=0;k=0;
      for(let j=0;j<p.bh;j+=p.st){const row=(y+j)*T.w+x;for(let i=0;i<p.bw;i+=p.st){d+=Math.abs((g[row+i]-m)-(r.g[k]-r.m));k++;}}
      if(d<best)best=d;
    }
    return best/r.g.length/r.tex;
  }

  function half(g,w,h){
    const w2=w>>1,h2=h>>1,o=new Uint8Array(w2*h2);
    for(let y=0;y<h2;y++){const r0=2*y*w,r1=r0+w;for(let x=0;x<w2;x++){const i=2*x;o[y*w2+x]=(g[r0+i]+g[r0+i+1]+g[r1+i]+g[r1+i+1])>>2;}}
    return o;
  }

  function global(prev,cur,w,h,dt){
    const w2=w>>1,h2=h>>1;
    const R2=radius(4,dt,10);
    const c=match(prev.g2,cur.g2,w2,h2,R2,R2,w2-2*R2,h2-2*R2,0,0,R2,2);
    const cx=c?Math.round(c.dx*2):0,cy=c?Math.round(c.dy*2):0;
    const lim=2+Math.max(Math.abs(cx),Math.abs(cy));
    const f=match(prev.g,cur.g,w,h,lim,lim,w-2*lim,h-2*lim,cx,cy,2,3);
    return f?[f.dx,f.dy]:(c?[c.dx*2,c.dy*2]:[0,0]);
  }

  function step(prev,cur,b,gdx,gdy,vx,vy){
    const r=region(b);
    const R=radius(P.trackR,cur.t-prev.t,8);
    const cands=[[Math.round(gdx),Math.round(gdy)]];
    for(const c of [[0,0],[Math.round(vx||0),Math.round(vy||0)]]){
      if(cands.every(k=>k[0]!==c[0]||k[1]!==c[1]))cands.push(c);
    }
    let best=null;
    for(const c of cands){
      const m=match(prev.g,cur.g,T.w,T.h,r.x,r.y,r.bw,r.bh,c[0],c[1],R,r.st);
      if(m&&(!best||m.sad<best.sad))best=m;
    }
    const s=T.scale;
    return best?{dx:best.dx*s,dy:best.dy*s,q:best.q}:null;
  }

  function motionStep(gray,w,h,scale,now){
    if(w!==T.w||h!==T.h||scale!==T.scale){T.frames=[];T.w=w;T.h=h;T.scale=scale;}
    const prev=T.frames[T.frames.length-1];
    if(prev&&now-prev.t<P.minStep)return false;
    const cur={t:now,g:gray,g2:half(gray,w,h),gdx:0,gdy:0};
    if(prev){
      const g=global(prev,cur,w,h,now-prev.t);
      cur.gdx=g[0];cur.gdy=g[1];
      const prev2=T.frames[T.frames.length-2];
      const hw0=histWin();
      for(const t of T.tracks){
        const lh=t.hist[t.hist.length-1];
        const sd=Math.max(1,now-prev.t);
        kfPredict(t,sd);
        const coastOk=t.kf.p<P.kfPmax&&now-t.kfT<coastWin();
        const m=step(prev,cur,t.pos,cur.gdx,cur.gdy,lh?lh.dx/T.scale:0,lh?lh.dy/T.scale:0);
        let dx,dy,good=!!m&&m.q<P.qPoor;
        if(good){
          dx=m.dx;dy=m.dy;
          if(prev2&&lh&&lh.t===prev.t&&Math.hypot(dx,dy)<T.scale&&Math.hypot(lh.dx,lh.dy)<T.scale){
            const b2=[t.pos[0]-lh.dx,t.pos[1]-lh.dy,t.pos[2],t.pos[3]];
            const g2x=(prev.gdx||0)+(cur.gdx||0),g2y=(prev.gdy||0)+(cur.gdy||0);
            const m2=step(prev2,cur,b2,g2x,g2y,(lh.dx+dx)/T.scale,(lh.dy+dy)/T.scale);
            if(m2&&m2.q<P.qPoor){dx=m2.dx-lh.dx;dy=m2.dy-lh.dy;}
          }
        }else if(coastOk){dx=cur.gdx*T.scale+t.kf.vx*sd;dy=cur.gdy*T.scale+t.kf.vy*sd;}
        else{dx=cur.gdx*T.scale;dy=cur.gdy*T.scale;}
        t.pos[0]+=dx;t.pos[1]+=dy;
        const pb=[t.pos[0]+t.pos[2]*0.2,t.pos[1]+t.pos[3]*0.1,t.pos[2]*0.6,t.pos[3]*0.8];
        const owned=!T.tracks.some(o=>o!==t&&inside(pb,o.pos)>0.5);
        let rq=owned?0:1;
        if(t.fresh||!t.ref){if(owned){capture(t,cur.g);t.rq=0;t.fresh=0;}}
        else{
          rq=refQ(t,cur.g);
          if(rq<0){if(owned){capture(t,cur.g);rq=0;}else rq=1;}
          else t.rq=t.rq*0.5+rq*0.5;
        }
        if(rq>P.refPoor&&(!good||!owned)){
          t.pos[0]-=dx;t.pos[1]-=dy;
          if(coastOk){dx=cur.gdx*T.scale+t.kf.vx*sd;dy=cur.gdy*T.scale+t.kf.vy*sd;}else{dx=cur.gdx*T.scale;dy=cur.gdy*T.scale;}
          t.pos[0]+=dx;t.pos[1]+=dy;good=false;
        }
        t.vel=[dx/sd,dy/sd];t.velT=now;t.mq=m?m.q:1;t.nm=m?0:(t.nm||0)+1;
        if(good&&owned&&rq<P.refGood){kfUpdate(t,(dx-cur.gdx*T.scale)/sd,(dy-cur.gdy*T.scale)/sd,P.kfR*(1+4*m.q));t.kfT=now;}
        else if(good&&owned)kfUpdate(t,(dx-cur.gdx*T.scale)/sd,(dy-cur.gdy*T.scale)/sd,P.kfR*20);
        if(owned)refresh(t,now,false);
        trail(t,now);
        t.hist.push({t:now,dx,dy});
        while(t.hist.length&&t.hist[0].t<now-hw0)t.hist.shift();
      }
    }
    T.frames.push(cur);
    const hw=histWin();
    while(T.frames.length&&T.frames[0].t<now-hw)T.frames.shift();
    return true;
  }

  function replay(box,ts){
    const f=T.frames;
    const from=Math.max(ts-10,(f.length?f[f.length-1].t:ts)-replayWin());
    let i=0;
    while(i<f.length&&f[i].t<from)i++;
    const b=box.slice();
    let vx=0,vy=0;
    for(;i+1<f.length;i++){
      const m=step(f[i],f[i+1],b,f[i+1].gdx,f[i+1].gdy,vx,vy);
      const dx=m&&m.q<P.qPoor?m.dx:f[i+1].gdx*T.scale,dy=m&&m.q<P.qPoor?m.dy:f[i+1].gdy*T.scale;
      b[0]+=dx;b[1]+=dy;vx=dx/T.scale;vy=dy/T.scale;
    }
    return b;
  }

  function sumSince(h,ts){
    let dx=0,dy=0;
    for(let i=h.length-1;i>=0&&h[i].t>ts;i--){dx+=h[i].dx;dy+=h[i].dy;}
    return [dx,dy];
  }
  function posAt(t,ts){const [dx,dy]=sumSince(t.hist,ts);return [t.pos[0]-dx,t.pos[1]-dy,t.pos[2],t.pos[3]];}

  function suppress(dets){
    dets.sort((a,b)=>b.score-a.score);
    const out=[];
    for(const d of dets){
      const ad=d.box[2]*d.box[3];
      if(ad<=0)continue;
      let keep=true;
      for(let i=0;i<out.length;i++){
        const o=out[i];
        if(o.grp!==d.grp)continue;
        const ao=o.box[2]*o.box[3];
        if(ad<=ao){if(inside(d.box,o.box)>=P.contain){keep=false;break;}}
        else if(inside(o.box,d.box)>=P.contain&&d.score>=P.high){out.splice(i,1);i--;}
      }
      if(keep)out.push(d);
    }
    return out;
  }

  const PET={dog:1.5,cat:1.5};
  function vote(t,d){
    t.votes[d.cls]=(t.votes[d.cls]||0)*0.8+d.score*(PET[d.cls]||1);
    let best=t.cls,bv=-1;
    for(const k in t.votes)if(t.votes[k]>bv){bv=t.votes[k];best=k;}
    if(t.grp!=='person'&&!PET[best]){const pd=t.votes.dog||0,pc=t.votes.cat||0;if(Math.max(pd,pc)>=0.6*bv)best=pd>=pc?'dog':'cat';}
    t.cls=best;
  }

  function adopt(t,d,ts,now,weak){
    const nb=d.now||(d.now=replay(d.box,ts));
    if(P.deadReckon&&(t.nm||0)>=2&&t.kf.p<P.kfPmax&&now-t.kfT<coastWin()){
      const lag=now-ts;
      nb[0]+=t.kf.vx*lag;nb[1]+=t.kf.vy*lag;
    }
    const w=weak?0.45:0.7;
    if(ts>=t.tDet)for(let k=0;k<4;k++)t.pos[k]=t.pos[k]*(1-w)+nb[k]*w;
    if(P.detVel&&!weak&&ts>t.tDet&&(t.nm||0)>=2){
      const cx=d.box[0]+d.box[2]/2,cy=d.box[1]+d.box[3]/2;
      if(t.dprev){const dt=ts-t.dprev.ts;if(dt>50&&dt<3000){const [gx,gy]=gdisp(t.dprev.ts,ts);kfUpdate(t,(cx-t.dprev.cx-gx)/dt,(cy-t.dprev.cy-gy)/dt,Math.max(P.kfR,18/(dt*dt)));t.kfT=now;}}
      t.dprev={ts,cx,cy};
    }
    t.tDet=Math.max(t.tDet,ts);if(!weak)t.hits++;t.miss=0;t.hard=0;t.lastSeen=now;t.part=0;
    if(!weak)t.fresh=1;
    t.weakRun=weak?(t.weakRun||0)+1:0;
    t.score=weak?Math.max(t.score*0.92,d.score):t.score*0.6+d.score*0.4;
    t.peak=Math.max(t.peak,d.score);
    vote(t,d);
  }

  function assign(tr,at,dets,usedT,usedD,minIou,ts,now,weak){
    const pairs=[];
    tr.forEach((t,i)=>{if(usedT.has(i)||(weak&&(t.weakRun||0)>=P.lowMax&&moving(t,now)>3))return;dets.forEach((d,j)=>{if(usedD.has(j)||d.grp!==t.grp)return;const v=iou(at[i],d.box);if(v>=minIou)pairs.push([v,i,j]);});});
    pairs.sort((a,b)=>b[0]-a[0]);
    for(const [,i,j] of pairs){
      if(usedT.has(i)||usedD.has(j))continue;
      usedT.add(i);usedD.add(j);adopt(tr[i],dets[j],ts,now,weak);
    }
  }

  function update(dets,ts,now,roi){
    if(ts<T.lastTs-P.stale)return;
    if(T.lastTs&&ts>T.lastTs){const g=ts-T.lastTs;T.detInt=T.detInt?T.detInt*0.7+g*0.3:g;}
    const lat=Math.max(0,now-ts);T.lat=T.lat?T.lat*0.7+lat*0.3:lat;
    T.lastTs=Math.max(T.lastTs,ts);
    for(const d of dets)d.grp=GROUP(d.cls);
    dets=suppress(dets.filter(d=>d.score>=P.low));
    const hi=dets.filter(d=>d.score>=P.high),lo=dets.filter(d=>d.score<P.high);
    const tr=T.tracks;
    const at=tr.map(t=>posAt(t,ts));
    const usedT=new Set(),usedH=new Set(),usedL=new Set();
    assign(tr,at,hi,usedT,usedH,P.matchIou,ts,now,false);
    hi.forEach((d,j)=>{
      if(usedH.has(j))return;
      d.now=replay(d.box,ts);
      let bi=-1,bv=0;
      tr.forEach((t,i)=>{if(usedT.has(i)||t.grp!==d.grp)return;const v=iou(t.pos,d.now);if(v>=P.matchIou&&v>bv){bv=v;bi=i;}});
      if(bi>=0){usedT.add(bi);usedH.add(j);adopt(tr[bi],d,ts,now,false);}
    });
    hi.forEach((d,j)=>{
      if(!P.nearMatch||usedH.has(j)||d.box[3]>=P.smallH*(T.h*T.scale||1)*1.5)return;
      let bi=-1,bd=Infinity;
      tr.forEach((t,i)=>{if(usedT.has(i)||t.grp!==d.grp||!near(t.pos,d.now))return;const dd=Math.hypot(t.pos[0]-d.now[0],t.pos[1]-d.now[1]);if(dd<bd){bd=dd;bi=i;}});
      if(bi>=0){usedT.add(bi);usedH.add(j);adopt(tr[bi],d,ts,now,false);}
    });
    assign(tr,at,lo,usedT,usedL,P.lowIou,ts,now,true);
    hi.forEach((d,j)=>{
      if(usedH.has(j))return;
      let bi=-1,bv=0;
      tr.forEach((t,i)=>{if(usedT.has(i)||t.grp!==d.grp)return;const v=Math.max(inside(at[i],d.box),inside(t.pos,d.now));if(v>=P.partIn&&v>bv){bv=v;bi=i;}});
      if(bi>=0){usedT.add(bi);usedH.add(j);adopt(tr[bi],d,ts,now,false);}
    });
    hi.forEach((d,j)=>{
      if(usedH.has(j))return;
      let bi=-1,bv=0;
      tr.forEach((t,i)=>{if(usedT.has(i)||t.grp!==d.grp)return;const v=Math.max(inside(d.box,at[i]),inside(d.now,t.pos));if(v>=P.partIn&&v>bv){bv=v;bi=i;}});
      if(bi<0)return;
      const t=tr[bi];usedT.add(bi);usedH.add(j);
      t.part++;
      if(t.part>=P.partAccept)adopt(t,d,ts,now,false);
      else{t.tDet=ts;t.miss=0;t.lastSeen=now;t.hits++;t.score=Math.max(t.score*0.9,d.score);vote(t,d);}
    });
    tr.forEach((t,i)=>{if(!usedT.has(i)){t.miss++;t.score*=0.93;if(covered(t,at[i],roi))t.hard=(t.hard||0)+1;}});
    const persons=hi.filter(d=>d.grp==='person'&&d.score>=0.5);
    for(let i=tr.length-1;i>=0;i--){const t=tr[i];if(t.grp==='person'||(t.miss<2&&(t.weakRun||0)<2))continue;if(persons.some(d=>inside(t.pos,d.now||d.box)>=0.6))tr.splice(i,1);}
    const fw=T.w*T.scale,fh=T.h*T.scale||1;
    const cands=[];
    hi.forEach((d,j)=>{if(!usedH.has(j))cands.push(d);});
    lo.forEach((d,j)=>{if(!usedL.has(j)&&d.box[3]<P.smallH*fh&&d.score>=P.freshSmall)cands.push(d);});
    cands.forEach(d=>{
      d.now=d.now||replay(d.box,ts);
      const small=d.box[3]<P.smallH*fh;
      const animal=d.grp!=='person';
      if(d.score<(small?P.freshSmall:(animal?P.freshAnimal:P.fresh)))return;
      for(const t of tr){
        if(t.grp===d.grp&&inside(d.now,t.pos)>=P.partIn)return;
        if(t.grp!==d.grp&&t.hits>=P.establish&&inside(d.now,t.pos)>=P.crossIn&&d.score<P.crossScore)return;
        if(animal&&t.grp==='person'&&iou(d.now,t.pos)>=0.5&&t.score>d.score)return;
      }
      const m=fw*0.02;
      const edge=fw>0&&(d.now[0]<=m||d.now[1]<=m||d.now[0]+d.now[2]>=fw-m||d.now[1]+d.now[3]>=fh-m);
      const nt={id:T.nextId++,cls:d.cls,grp:d.grp,votes:{[d.cls]:d.score*(PET[d.cls]||1)},pos:d.now.slice(),box:d.now.slice(),hist:[],trail:[],kf:{vx:0,vy:0,p:1},kfT:0,tDet:ts,score:d.score,peak:d.score,hits:1,miss:0,hard:0,part:0,small,animal,edge,lastSeen:now,born:now};
      refresh(nt,now,true);
      let old=null,od=Infinity;
      for(const t of tr){
        if(t.grp!==d.grp||t.miss<2||t.pos[3]>=0.3*fh)continue;
        const ratio=d.now[3]/Math.max(1,t.pos[3]);
        if(ratio<0.5||ratio>2)continue;
        const dist=Math.hypot(d.now[0]+d.now[2]/2-t.pos[0]-t.pos[2]/2,d.now[1]+d.now[3]/2-t.pos[1]-t.pos[3]/2);
        if(dist<=P.handR*Math.max(t.pos[2],t.pos[3])&&dist<od){od=dist;old=t;}
      }
      if(old){nt.id=old.id;nt.hits=Math.max(nt.hits,Math.min(old.hits,P.establish));nt.peak=Math.max(nt.peak,old.peak);nt.trail=old.trail;nt.born=old.born;tr.splice(tr.indexOf(old),1);}
      else{
        const L=T.lost;let best=null,bs=0;

  if(ct!==cntText){cntText=ct;cnt.textContent=ct;}
  const pt=Math.round(fps)+' FPS'+(kind==='pc'?(pc.up?' · '+Math.round(ageMs)+'мс · ПК·'+(pc.info?pc.info.model.replace(/^yolo/,''):'')+' · '+detRate.toFixed(1)+'/с':' · нет связи с ПК')+(recorder?' · зап '+Math.round(recFps):''):detectors.length?' · '+Math.round(inferMs)+'мс · '+LABEL[kind]+(detectors.length>1?'×'+detectors.length:'')+'·'+MODELS[MKEY].name+(MODELS[MKEY].rect?'r':SIZE)+' · '+detRate.toFixed(1)+'/с'+(recorder?' · зап '+Math.round(recFps):''):' · загрузка…');

function feedRec(vw,vh,mirror,S){

function adaptRec(){

    try{await navigator.share({files:[file]});return true;}
    catch(e){if(e&&e.name==='AbortError')return false;}
  }

  const a=document.createElement('a');
  a.href=href;a.download=file.name;a.rel='noopener';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();if(!url)URL.revokeObjectURL(href);},60000);
  toast('Сохранено: '+file.name);

}

  flip.disabled=false;
});

if(/MiuiBrowser/i.test(navigator.userAgent))msg.textContent+=' Лучше открыть эту страницу в Chrome.';
if(PCMODE)msg.textContent='Камера находит людей и животных и обводит каждого рамкой. Нейросеть работает на компьютере.';

go.addEventListener('click',async()=>{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    msg.textContent='Браузер не даёт доступ к камере. Страницу нужно открыть по адресу https://';
    return;
  }
  go.disabled=true;started=true;
  try{
    msg.textContent='Включаю камеру…';
    await openCamera();
  }catch(e){
    msg.textContent='Камера: '+errText(e);
    go.disabled=false;
    return;
  }
  startScreen.hidden=true;top.hidden=false;bar.hidden=false;panel.hidden=false;
  running=true;lastFrame=fpsT=performance.now();
  probeRecCodec().then(c=>{recCodec=c;}).catch(()=>{recCodec=false;});
  keepAwake();
  render();
  if(PCMODE){
    kind='pc';
    pcStart();
    detectors=[{doneAt:0,close(){}},{doneAt:0,close(){}}];
    toast('Подключаюсь к ПК…',0);
    for(const d of detectors)pcLoop(d);
    return;
  }
  toast('Загружаю нейросеть…',0);
  try{
    const d=await createDetector();
    detectors=[d];
    toast('Нейросеть готова · '+LABEL[kind],1500);
    detectLoop(d);
    addWorkers();
  }catch(e){
    if(ISO){await dropSw();location.reload();return;}
    toast('Не удалось загрузить нейросеть: '+errText(e)+'. Проверьте интернет и откройте страницу заново.',0);
  }
});

document.addEventListener('visibilitychange',()=>{
  if(!running)return;
  if(document.hidden){stopRec();return;}
  keepAwake();
  video.play().catch(()=>{});
  setTimeout(()=>{
    if(!running||document.hidden)return;
    const t=stream&&stream.getVideoTracks()[0];
    if(!t||t.readyState==='ended'||t.muted)openCamera().catch(e=>toast('Ошибка камеры: '+errText(e)));
  },1000);
});
</script>
</body>
</html>
