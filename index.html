<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Камера-детектор</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden}
[hidden]{display:none!important}
#stage{position:fixed;inset:0}
canvas{width:100%;height:100%;object-fit:contain;display:block}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#hud{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 14px);right:calc(env(safe-area-inset-right,0px) + 14px);display:flex;justify-content:space-between;font:600 13px ui-monospace,Menlo,Consolas,monospace;color:#39ff7a;text-shadow:0 1px 3px #000;pointer-events:none}
#bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);left:0;right:0;display:flex;justify-content:center;gap:12px}
button{background:rgba(15,15,15,.72);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:13px 22px;font:600 15px -apple-system,system-ui,Segoe UI,Roboto,sans-serif;cursor:pointer}
button:disabled{opacity:.5}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#000;text-align:center;padding:24px}
#start h1{margin:0;font:700 22px ui-monospace,Menlo,Consolas,monospace;color:#39ff7a;letter-spacing:.04em}
#msg{opacity:.8;font-size:14px;max-width:320px;line-height:1.45}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<video id="v" playsinline muted autoplay></video>
<div id="hud" hidden><span id="hudL"></span><span id="hudR"></span></div>
<div id="bar" hidden><button id="flip">Сменить камеру</button></div>
<div id="start">
<h1>PERSON DETECT</h1>
<div id="msg">Камера ищет людей и обводит каждого рамкой по его размеру.</div>
<button id="go">Включить камеру</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.20.0/dist/tf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/coco-ssd@2.2.3/dist/coco-ssd.min.js"></script>
<script>
const video=document.getElementById('v');
const canvas=document.getElementById('c');
const ctx=canvas.getContext('2d');
const hud=document.getElementById('hud');
const hudL=document.getElementById('hudL');
const hudR=document.getElementById('hudR');
const bar=document.getElementById('bar');
const flip=document.getElementById('flip');
const startScreen=document.getElementById('start');
const msg=document.getElementById('msg');
const go=document.getElementById('go');

let model=null;
let stream=null;
let facing='environment';
let tracks=[];
let nextId=1;
let running=false;
let fps=0,fpsN=0,fpsT=performance.now();

async function openCamera(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  stream=await navigator.mediaDevices.getUserMedia({audio:false,video:{facingMode:{ideal:facing},width:{ideal:1280},height:{ideal:720}}});
  video.srcObject=stream;
  await video.play();
  if(!video.videoWidth){await new Promise(r=>video.addEventListener('loadedmetadata',r,{once:true}));}
  canvas.width=video.videoWidth;
  canvas.height=video.videoHeight;
  tracks=[];
}

function iou(a,b){
  const x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]);
  const x2=Math.min(a[0]+a[2],b[0]+b[2]),y2=Math.min(a[1]+a[3],b[1]+b[3]);
  const inter=Math.max(0,x2-x1)*Math.max(0,y2-y1);
  const uni=a[2]*a[3]+b[2]*b[3]-inter;
  return uni>0?inter/uni:0;
}

function updateTracks(dets){
  const pairs=[];
  for(let i=0;i<tracks.length;i++){
    for(let j=0;j<dets.length;j++){
      const v=iou(tracks[i].target,dets[j].bbox);
      if(v>0.2)pairs.push([v,i,j]);
    }
  }
  pairs.sort((a,b)=>b[0]-a[0]);
  const usedT=new Set(),usedD=new Set();
  for(const [,i,j] of pairs){
    if(usedT.has(i)||usedD.has(j))continue;
    usedT.add(i);usedD.add(j);
    tracks[i].target=dets[j].bbox.slice();
    tracks[i].score=dets[j].score;
    tracks[i].miss=0;
  }
  tracks.forEach((t,i)=>{if(!usedT.has(i))t.miss++;});
  dets.forEach((d,j)=>{
    if(!usedD.has(j))tracks.push({id:nextId++,box:d.bbox.slice(),target:d.bbox.slice(),score:d.score,miss:0});
  });
  tracks=tracks.filter(t=>t.miss<4);
}

async function detectLoop(){
  if(!running)return;
  try{
    if(video.readyState>=2&&video.videoWidth){
      const preds=await model.detect(video,20,0.5);
      updateTracks(preds.filter(p=>p.class==='person').map(p=>({bbox:p.bbox,score:p.score})));
    }
  }finally{
    setTimeout(detectLoop,0);
  }
}

function drawBox(x,y,w,h,t){
  const s=Math.max(1,canvas.width/640);
  const color=t.miss===0?'#39ff7a':'#ffcc33';
  ctx.strokeStyle=color;
  ctx.globalAlpha=0.55;
  ctx.lineWidth=1.5*s;
  ctx.strokeRect(x,y,w,h);
  ctx.globalAlpha=1;
  const L=Math.min(w,h)*0.22;
  ctx.lineWidth=4*s;
  ctx.lineCap='square';
  ctx.beginPath();
  ctx.moveTo(x,y+L);ctx.lineTo(x,y);ctx.lineTo(x+L,y);
  ctx.moveTo(x+w-L,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+L);
  ctx.moveTo(x+w,y+h-L);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w-L,y+h);
  ctx.moveTo(x+L,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+h-L);
  ctx.stroke();
  const label='ЧЕЛОВЕК #'+t.id+'  '+Math.round(t.score*100)+'%';
  ctx.font='600 '+(14*s)+'px ui-monospace,Menlo,Consolas,monospace';
  const tw=ctx.measureText(label).width+12*s;
  const th=22*s;
  const ly=y-th-4*s<0?y+4*s:y-th-4*s;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(x,ly,tw,th);
  ctx.fillStyle=color;
  ctx.textBaseline='middle';
  ctx.fillText(label,x+6*s,ly+th/2);
}

function render(){
  if(!running)return;
  const vw=video.videoWidth,vh=video.videoHeight;
  if(vw&&vh&&(canvas.width!==vw||canvas.height!==vh)){canvas.width=vw;canvas.height=vh;}
  const mirror=facing==='user';
  ctx.save();
  if(mirror){ctx.translate(canvas.width,0);ctx.scale(-1,1);}
  if(vw&&vh)ctx.drawImage(video,0,0,canvas.width,canvas.height);
  ctx.restore();
  for(const t of tracks){
    for(let k=0;k<4;k++)t.box[k]+=(t.target[k]-t.box[k])*0.35;
    let [x,y,w,h]=t.box;
    if(mirror)x=canvas.width-x-w;
    drawBox(x,y,w,h,t);
  }
  fpsN++;
  const now=performance.now();
  if(now-fpsT>=1000){fps=fpsN*1000/(now-fpsT);fpsN=0;fpsT=now;}
  hudL.textContent='ЛЮДЕЙ: '+tracks.filter(t=>t.miss===0).length;
  hudR.textContent=Math.round(fps)+' FPS';
  requestAnimationFrame(render);
}

async function keepAwake(){
  try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen');}catch(e){}
}

go.addEventListener('click',async()=>{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    msg.textContent='Браузер не даёт доступ к камере. Страницу нужно открыть по https:// (или локально в Chrome на ПК).';
    return;
  }
  go.disabled=true;
  try{
    msg.textContent='Загружаю нейросеть…';
    if(!model){await tf.ready();model=await cocoSsd.load({base:'lite_mobilenet_v2'});}
    msg.textContent='Включаю камеру…';
    await openCamera();
    startScreen.hidden=true;
    hud.hidden=false;
    bar.hidden=false;
    running=true;
    keepAwake();
    render();
    detectLoop();
  }catch(e){
    msg.textContent='Ошибка: '+(e&&e.message?e.message:String(e));
    go.disabled=false;
  }
});

flip.addEventListener('click',async()=>{
  flip.disabled=true;
  const prev=facing;
  facing=facing==='environment'?'user':'environment';
  try{
    await openCamera();
  }catch(e){
    facing=prev;
    try{await openCamera();}catch(e2){msg.textContent='Ошибка камеры: '+(e2&&e2.message?e2.message:String(e2));}
  }
  flip.disabled=false;
});

document.addEventListener('visibilitychange',()=>{if(!document.hidden&&running)keepAwake();});
</script>
</body>
</html>
