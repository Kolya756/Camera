<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Камера-детектор</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
#stage{position:fixed;inset:0}
#c{width:100%;height:100%;object-fit:contain;display:block}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#hud{font:600 13px ui-monospace,Menlo,Consolas,monospace;color:#39ff7a;text-shadow:0 1px 3px #000;line-height:1.5;white-space:nowrap}
#modes{display:flex;background:rgba(15,15,15,.72);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px;pointer-events:auto;flex-shrink:0}
#modes button{background:transparent;border:0;color:#fff;border-radius:999px;padding:7px 12px;font:600 13px -apple-system,system-ui,Segoe UI,Roboto,sans-serif;touch-action:manipulation;cursor:pointer}
#modes button.on{background:#39ff7a;color:#000}
#rec{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);right:calc(env(safe-area-inset-right,0px) + 14px);display:flex;align-items:center;gap:7px;font:700 13px ui-monospace,Menlo,Consolas,monospace;color:#ff4d4d;text-shadow:0 1px 3px #000;pointer-events:none}
#rec i{width:10px;height:10px;border-radius:50%;background:#ff4d4d;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;padding:0 12px}
.btn{background:rgba(15,15,15,.72);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:12px 18px;font:600 15px -apple-system,system-ui,Segoe UI,Roboto,sans-serif;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.btn:disabled{opacity:.45}
#record{min-width:96px}
#record.live{background:#ff4d4d;border-color:#ff4d4d}
#shot{width:68px;height:68px;border-radius:50%;background:#fff;border:4px solid rgba(0,0,0,.55);box-shadow:0 0 0 3px rgba(255,255,255,.85);padding:0}
#shot:active{transform:scale(.92)}
#save{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:rgba(15,15,15,.9);border:1px solid rgba(255,255,255,.3);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px)}
#save span{font-size:14px;white-space:nowrap}
#save .btn{padding:10px 14px}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(15,15,15,.88);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:12px 16px;font-size:14px;max-width:80%;text-align:center;pointer-events:none;line-height:1.4}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#000;text-align:center;padding:24px}
#start h1{margin:0;font:700 22px ui-monospace,Menlo,Consolas,monospace;color:#39ff7a;letter-spacing:.04em}
#msg{opacity:.8;font-size:14px;max-width:320px;line-height:1.45}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<video id="v" playsinline muted autoplay></video>
<div id="flash"></div>
<div id="top" hidden>
<div id="hud"><div id="cnt"></div><div id="perf"></div></div>
<div id="modes"><button data-mode="person" class="on">Люди</button><button data-mode="animal">Животные</button><button data-mode="all">Все</button></div>
</div>
<div id="rec" hidden><i></i><span id="recT">00:00</span></div>
<div id="bar" hidden><button id="record" class="btn">Запись</button><button id="shot" class="btn" aria-label="Фото"></button><button id="flip" class="btn">Сменить</button></div>
<div id="save" hidden><span id="saveMsg"></span><button id="saveBtn" class="btn">Сохранить</button><button id="discardBtn" class="btn">✕</button></div>
<div id="toast" hidden></div>
<div id="start">
<h1>DETECT CAM</h1>
<div id="msg">Камера находит людей и животных и обводит каждого рамкой. Фото и видео сохраняются вместе с рамками.</div>
<button id="go" class="btn">Включить камеру</button>
</div>
<script type="module">
const MP='https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@1.2.0';
const MODEL='https://storage.googleapis.com/mediapipe-models/object_detector/efficientdet_lite2/float16/1/efficientdet_lite2.tflite';
const ANIMALS=['bird','cat','dog','horse','sheep','cow','elephant','bear','zebra','giraffe'];
const CLASSES=['person',...ANIMALS];
const RU={person:'ЧЕЛОВЕК',bird:'ПТИЦА',cat:'КОШКА',dog:'СОБАКА',horse:'ЛОШАДЬ',sheep:'ОВЦА',cow:'КОРОВА',elephant:'СЛОН',bear:'МЕДВЕДЬ',zebra:'ЗЕБРА',giraffe:'ЖИРАФ'};
const FRAME_MAX=640;
const KEEP_SCORE=0.3,NEW_SCORE=0.45,SHOW_SCORE=0.35,SURE_SCORE=0.7,MATCH_IOU=0.25,TTL=700,CONFIRM_HITS=2,CONTAIN=0.9;
const LABEL={wgpu:'GPU',wcpu:'CPU',main:'CPU·'};
const AFTER={wgpu:['wcpu','main'],wcpu:['main'],main:[]};
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

const $=id=>document.getElementById(id);
const video=$('v'),canvas=$('c'),ctx=canvas.getContext('2d');
const top=$('top'),cnt=$('cnt'),perf=$('perf'),modes=$('modes'),rec=$('rec'),recT=$('recT');
const bar=$('bar'),record=$('record'),shot=$('shot'),flip=$('flip');
const save=$('save'),saveMsg=$('saveMsg'),saveBtn=$('saveBtn'),discardBtn=$('discardBtn');
const toastEl=$('toast'),flash=$('flash'),startScreen=$('start'),msg=$('msg'),go=$('go');
const fc=document.createElement('canvas');
const fctx=fc.getContext('2d',{willReadFrequently:true});

let stream=null,facing='environment',mode='person',running=false;
let detector=null,kind='';
let tracks=[],nextId=1,lastTs=0,inferMs=0;
let fps=0,fpsN=0,fpsT=0,lastFrame=0;
let toastTimer=null;

try{const m=localStorage.getItem('mode');if(m==='person'||m==='animal'||m==='all')mode=m;const f=localStorage.getItem('facing');if(f==='user'||f==='environment')facing=f;}catch(e){}

const WORKER_SRC=`
importScripts('${MP}/vision_bundle.js');
const {ObjectDetector,FilesetResolver}=self.Vision;
let det=null;
self.onmessage=async e=>{
  const m=e.data;
  if(m.type==='init'){
    try{
      const files=await FilesetResolver.forVisionTasks('${MP}/wasm');
      det=await ObjectDetector.createFromOptions(files,{baseOptions:{modelAssetPath:m.model,delegate:m.delegate},runningMode:'VIDEO',scoreThreshold:${KEEP_SCORE},maxResults:30,categoryAllowlist:m.classes});
      self.postMessage({type:'ready'});
    }catch(err){self.postMessage({type:'error',message:String(err&&err.message||err)});}
    return;
  }
  if(m.type==='frame'){
    try{
      const img=new ImageData(new Uint8ClampedArray(m.buf),m.w,m.h);
      const t0=performance.now();
      const r=det.detectForVideo(img,m.ts);
      const dets=r.detections.map(d=>({cls:d.categories[0].categoryName,score:d.categories[0].score,box:[d.boundingBox.originX,d.boundingBox.originY,d.boundingBox.width,d.boundingBox.height]}));
      self.postMessage({type:'result',dets,ms:performance.now()-t0});
    }catch(err){self.postMessage({type:'error',message:String(err&&err.message||err)});}
  }
};`;

function workerDetector(delegate){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'}));
    let w;
    try{w=new Worker(url);}catch(e){reject(e);return;}
    let pending=null,ready=false;
    const fail=err=>{w.terminate();if(pending){const p=pending;pending=null;p.reject(err);}if(!ready)reject(err);};
    const timer=setTimeout(()=>fail(new Error('время ожидания вышло')),180000);
    w.onerror=ev=>{clearTimeout(timer);fail(new Error(ev.message||'ошибка воркера'));};
    w.onmessage=ev=>{
      const m=ev.data;
      if(m.type==='ready'){
        clearTimeout(timer);ready=true;
        resolve({
          detect(img,ts){return new Promise((res,rej)=>{pending={resolve:res,reject:rej};w.postMessage({type:'frame',buf:img.data.buffer,w:img.width,h:img.height,ts},[img.data.buffer]);});},
          close(){w.terminate();}
        });
      }else if(m.type==='result'){
        if(pending){const p=pending;pending=null;p.resolve(m);}
      }else if(m.type==='error'){
        clearTimeout(timer);fail(new Error(m.message));
      }
    };
    w.postMessage({type:'init',model:MODEL,delegate,classes:CLASSES});
  });
}

async function mainDetector(delegate){
  const {ObjectDetector,FilesetResolver}=await import(MP+'/vision_bundle.mjs');
  const files=await FilesetResolver.forVisionTasks(MP+'/wasm');
  const det=await ObjectDetector.createFromOptions(files,{baseOptions:{modelAssetPath:MODEL,delegate},runningMode:'VIDEO',scoreThreshold:KEEP_SCORE,maxResults:30,categoryAllowlist:CLASSES});
  return {
    async detect(img,ts){
      await sleep(0);
      const t0=performance.now();
      const r=det.detectForVideo(img,ts);
      const dets=r.detections.map(d=>({cls:d.categories[0].categoryName,score:d.categories[0].score,box:[d.boundingBox.originX,d.boundingBox.originY,d.boundingBox.width,d.boundingBox.height]}));
      return {dets,ms:performance.now()-t0};
    },
    close(){det.close();}
  };
}

const KINDS={wgpu:()=>workerDetector('GPU'),wcpu:()=>workerDetector('CPU'),main:()=>mainDetector('CPU')};

function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('время ожидания вышло')),ms))]);}

async function videoReady(){while(!(video.readyState>=2&&video.videoWidth))await sleep(50);}

async function measure(d){
  await videoReady();
  for(let i=0;i<2;i++)await withTimeout(d.detect(grabFrame().img,nextTs()),20000);
  const t=[];
  for(let i=0;i<3;i++){const t0=performance.now();await withTimeout(d.detect(grabFrame().img,nextTs()),20000);t.push(performance.now()-t0);}
  t.sort((a,b)=>a-b);
  return t[1];
}

async function createDetector(){
  const force=new URLSearchParams(location.search).get('backend');
  if(force&&KINDS[force]){kind=force;return KINDS[force]();}
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem('backend')||'null');}catch(e){}
  if(saved&&saved.model===MODEL&&KINDS[saved.kind]){
    try{const d=await KINDS[saved.kind]();kind=saved.kind;return d;}catch(e){}
  }
  const tries=IOS?['wcpu']:['wgpu','wcpu'];
  const res=await Promise.allSettled(tries.map(k=>KINDS[k]()));
  const cands=[];
  res.forEach((r,i)=>{if(r.status==='fulfilled')cands.push({kind:tries[i],d:r.value,ms:Infinity});});
  if(!cands.length){const d=await KINDS.main();kind='main';return d;}
  if(cands.length===1){
    kind=cands[0].kind;
    try{localStorage.setItem('backend',JSON.stringify({kind,model:MODEL}));}catch(e){}
    return cands[0].d;
  }
  toast('Подбираю режим работы…',0);
  let best=null;
  for(const c of cands){
    try{c.ms=await measure(c.d);}catch(e){c.ms=Infinity;}
    if(!best||c.ms<best.ms)best=c;
  }
  for(const c of cands)if(c!==best)c.d.close();
  if(best.ms===Infinity){best.d.close();const d=await KINDS.main();kind='main';return d;}
  kind=best.kind;
  try{localStorage.setItem('backend',JSON.stringify({kind,model:MODEL}));}catch(e){}
  return best.d;
}

async function fallbackDetector(){
  if(detector){try{detector.close();}catch(e){}detector=null;}
  try{localStorage.removeItem('backend');}catch(e){}
  for(const k of AFTER[kind]||[]){
    try{const d=await KINDS[k]();kind=k;detector=d;return;}catch(e){}
  }
  throw new Error('нейросеть недоступна');
}

function errText(e){return e&&e.message?e.message:String(e);}
function pad(n){return String(n).padStart(2,'0');}
function stamp(){const d=new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function nextTs(){let ts=performance.now();if(ts<=lastTs)ts=lastTs+1;lastTs=ts;return ts;}
function toast(text,ms){
  clearTimeout(toastTimer);
  toastEl.textContent=text;toastEl.hidden=false;
  if(ms!==0)toastTimer=setTimeout(()=>{toastEl.hidden=true;},ms||2500);
}

function gum(c){return withTimeout(navigator.mediaDevices.getUserMedia({audio:false,video:c}),10000);}

async function openCamera(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.srcObject=null;
  const base={width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}};
  try{stream=await gum({...base,facingMode:{exact:facing}});}
  catch(e){
    try{stream=await gum({...base,facingMode:facing});}
    catch(e2){stream=await gum(true);}
  }
  const s=stream;
  s.getVideoTracks().forEach(t=>t.addEventListener('ended',()=>{if(running&&stream===s)openCamera().catch(e=>toast('Ошибка камеры: '+errText(e)));}));
  video.srcObject=stream;
  await video.play();
  if(!video.videoWidth){await Promise.race([new Promise(r=>video.addEventListener('loadedmetadata',r,{once:true})),sleep(4000)]);}
  tracks=[];
  try{localStorage.setItem('facing',facing);}catch(e){}
}

function grabFrame(){
  const vw=video.videoWidth||2,vh=video.videoHeight||2;
  const s=Math.min(1,FRAME_MAX/Math.max(vw,vh));
  const fw=Math.max(2,Math.round(vw*s)),fh=Math.max(2,Math.round(vh*s));
  if(fc.width!==fw||fc.height!==fh){fc.width=fw;fc.height=fh;}
  fctx.drawImage(video,0,0,fw,fh);
  return {img:fctx.getImageData(0,0,fw,fh),scale:vw/fw};
}

function interArea(a,b){
  const x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]);
  const x2=Math.min(a[0]+a[2],b[0]+b[2]),y2=Math.min(a[1]+a[3],b[1]+b[3]);
  return Math.max(0,x2-x1)*Math.max(0,y2-y1);
}
function iou(a,b){
  const inter=interArea(a,b);
  const uni=a[2]*a[3]+b[2]*b[3]-inter;
  return uni>0?inter/uni:0;
}

function suppress(dets){
  dets.sort((a,b)=>b.score-a.score);
  const out=[];
  for(const d of dets){
    const ad=d.box[2]*d.box[3];
    if(ad<=0)continue;
    let keep=true;
    for(let i=0;i<out.length;i++){
      const o=out[i];
      if(o.cls!==d.cls)continue;
      const inter=interArea(o.box,d.box);
      const ao=o.box[2]*o.box[3];
      if(ad<=ao){
        if(inter/ad>=CONTAIN){keep=false;break;}
      }else if(inter/ao>=CONTAIN&&d.score>=o.score-0.15){
        out.splice(i,1);i--;
      }
    }
    if(keep)out.push(d);
  }
  return out;
}

function predict(t,now){
  const h=Math.min(250,Math.max(0,now-t.tDet))/1000*0.7;
  return [t.target[0]+t.vel[0]*h,t.target[1]+t.vel[1]*h,t.target[2]+t.vel[2]*h,t.target[3]+t.vel[3]*h];
}

function updateTracks(dets,now,ts){
  dets=suppress(dets.filter(d=>d.score>=KEEP_SCORE&&CLASSES.includes(d.cls)));
  const pairs=[];
  tracks.forEach((t,i)=>{
    const p=predict(t,ts);
    dets.forEach((d,j)=>{
      if(d.cls!==t.cls)return;
      const v=iou(p,d.box);
      if(v>=MATCH_IOU)pairs.push([v,i,j]);
    });
  });
  pairs.sort((a,b)=>b[0]-a[0]);
  const usedT=new Set(),usedD=new Set();
  for(const [,i,j] of pairs){
    if(usedT.has(i)||usedD.has(j))continue;
    usedT.add(i);usedD.add(j);
    const t=tracks[i],d=dets[j];
    const dt=(ts-t.tDet)/1000;
    if(dt>0.01){for(let k=0;k<4;k++){t.vel[k]=t.vel[k]*0.5+((d.box[k]-t.target[k])/dt)*0.5;}}
    t.target=d.box.slice();t.tDet=ts;
    t.score=t.score*0.6+d.score*0.4;
    t.hits++;t.miss=0;t.lastSeen=now;
  }
  tracks.forEach((t,i)=>{if(!usedT.has(i)){t.miss++;t.score*=0.9;}});
  dets.forEach((d,j)=>{
    if(usedD.has(j)||d.score<NEW_SCORE)return;
    tracks.push({id:nextId++,cls:d.cls,box:d.box.slice(),target:d.box.slice(),vel:[0,0,0,0],tDet:ts,score:d.score,hits:1,miss:0,lastSeen:now});
  });
  tracks=tracks.filter(t=>now-t.lastSeen<=TTL);
}

async function detectLoop(){
  while(running){
    if(!detector){await sleep(100);continue;}
    if(!(video.readyState>=2&&video.videoWidth)){await sleep(50);continue;}
    const {img,scale}=grabFrame();
    const ts=nextTs();
    try{
      const r=await detector.detect(img,ts);
      const now=performance.now();
      inferMs=inferMs?inferMs*0.8+r.ms*0.2:r.ms;
      updateTracks(r.dets.map(d=>({cls:d.cls,score:d.score,box:[d.box[0]*scale,d.box[1]*scale,d.box[2]*scale,d.box[3]*scale]})),now,ts);
    }catch(e){
      toast('Переключаю нейросеть…',0);
      try{await fallbackDetector();inferMs=0;toast('Нейросеть: '+LABEL[kind],1500);}
      catch(e2){detector=null;if(running)toast('Нейросеть остановилась: '+errText(e)+'. Откройте страницу заново.',0);return;}
    }
  }
}

function visible(t){
  if(t.score<SHOW_SCORE)return false;
  if(t.hits<CONFIRM_HITS&&t.score<SURE_SCORE)return false;
  if(mode==='person')return t.cls==='person';
  if(mode==='animal')return t.cls!=='person';
  return true;
}

function drawBox(x,y,w,h,t){
  const s=Math.max(1,canvas.width/640);
  const color=t.miss>0?'#ffcc33':(t.cls==='person'?'#39ff7a':'#3ad7ff');
  ctx.strokeStyle=color;
  ctx.globalAlpha=0.55;
  ctx.lineWidth=1.5*s;
  ctx.strokeRect(x,y,w,h);
  ctx.globalAlpha=1;
  const L=Math.min(w,h)*0.22;
  ctx.lineWidth=4*s;
  ctx.lineCap='square';
  ctx.beginPath();
  ctx.moveTo(x,y+L);ctx.lineTo(x,y);ctx.lineTo(x+L,y);
  ctx.moveTo(x+w-L,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+L);
  ctx.moveTo(x+w,y+h-L);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w-L,y+h);
  ctx.moveTo(x+L,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+h-L);
  ctx.stroke();
  const label=(RU[t.cls]||t.cls.toUpperCase())+' #'+t.id+'  '+Math.round(t.score*100)+'%';
  ctx.font='600 '+(14*s)+'px ui-monospace,Menlo,Consolas,monospace';
  const tw=ctx.measureText(label).width+12*s;
  const th=22*s;
  const ly=y-th-4*s<0?y+4*s:y-th-4*s;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(x,ly,tw,th);
  ctx.fillStyle=color;
  ctx.textBaseline='middle';
  ctx.fillText(label,x+6*s,ly+th/2);
}

function render(){
  if(!running)return;
  requestAnimationFrame(render);
  const vw=video.videoWidth,vh=video.videoHeight;
  if(!vw||!vh)return;
  if(canvas.width!==vw||canvas.height!==vh){canvas.width=vw;canvas.height=vh;}
  const now=performance.now();
  const dt=Math.min(100,now-lastFrame);lastFrame=now;
  const a=1-Math.exp(-dt/70);
  const mirror=facing==='user';
  ctx.save();
  if(mirror){ctx.translate(vw,0);ctx.scale(-1,1);}
  ctx.drawImage(video,0,0,vw,vh);
  ctx.restore();
  let nP=0,nA=0;
  for(const t of tracks){
    const p=predict(t,now);
    for(let k=0;k<4;k++)t.box[k]+=(p[k]-t.box[k])*a;
    if(!visible(t))continue;
    if(t.cls==='person')nP++;else nA++;
    let [x,y,w,h]=t.box;
    if(mirror)x=vw-x-w;
    drawBox(x,y,w,h,t);
  }
  fpsN++;
  if(now-fpsT>=1000){fps=fpsN*1000/(now-fpsT);fpsN=0;fpsT=now;}
  cnt.textContent=mode==='person'?'ЛЮДЕЙ: '+nP:mode==='animal'?'ЖИВОТНЫХ: '+nA:'ЛЮДЕЙ: '+nP+'  ЖИВОТНЫХ: '+nA;
  perf.textContent=Math.round(fps)+' FPS'+(detector?' · '+Math.round(inferMs)+' мс · '+LABEL[kind]:' · загрузка…');
}

function setMode(m){
  mode=m;
  for(const b of modes.children)b.classList.toggle('on',b.dataset.mode===m);
  try{localStorage.setItem('mode',m);}catch(e){}
}
modes.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.mode);});
setMode(mode);

async function keepAwake(){
  try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen');}catch(e){}
}

async function deliver(file,url){
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return true;}
    catch(e){if(e&&e.name==='AbortError')return false;}
  }
  const href=url||URL.createObjectURL(file);
  const a=document.createElement('a');
  a.href=href;a.download=file.name;a.rel='noopener';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();if(!url)URL.revokeObjectURL(href);},60000);
  toast('Сохранено: '+file.name);
  return true;
}

function dataUrlToFile(u,name,type){
  const b=atob(u.slice(u.indexOf(',')+1));
  const arr=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)arr[i]=b.charCodeAt(i);
  return new File([arr],name,{type});
}

shot.addEventListener('click',()=>{
  if(!running||!canvas.width)return;
  flash.style.opacity='0.85';
  setTimeout(()=>{flash.style.opacity='0';},70);
  const dataUrl=canvas.toDataURL('image/jpeg',0.92);
  const file=dataUrlToFile(dataUrl,'detect_'+stamp()+'.jpg','image/jpeg');
  deliver(file,dataUrl);
});

let recorder=null,recChunks=[],recStream=null,recStart=0,recTick=null,pendingFile=null,stopping=false;
function pickMime(){
  if(typeof MediaRecorder==='undefined')return null;
  for(const t of ['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'])if(MediaRecorder.isTypeSupported(t))return t;
  return '';
}
function hideSave(){save.hidden=true;pendingFile=null;}
function startRec(){
  const mime=pickMime();
  if(mime===null||!canvas.captureStream){toast('Этот браузер не умеет записывать видео');return;}
  hideSave();
  try{
    recStream=canvas.captureStream(30);
    const opts={videoBitsPerSecond:4000000};
    if(mime)opts.mimeType=mime;
    recorder=new MediaRecorder(recStream,opts);
  }catch(e){
    if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null;}
    recorder=null;toast('Запись не поддерживается: '+errText(e));return;
  }
  recChunks=[];
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data);};
  recorder.onerror=()=>{if(recorder&&recorder.state!=='inactive'){toast('Ошибка записи');stopRec();}};
  recorder.onstop=()=>{
    const type=(recorder.mimeType||mime||'video/webm').split(';')[0];
    const blob=new Blob(recChunks,{type});
    recChunks=[];
    recStream.getTracks().forEach(t=>t.stop());recStream=null;recorder=null;stopping=false;
    clearInterval(recTick);
    record.classList.remove('live');record.textContent='Запись';record.disabled=false;rec.hidden=true;flip.disabled=false;
    const sec=Math.round((performance.now()-recStart)/1000);
    if(blob.size<2000||sec<1){toast('Видео не записалось');return;}
    pendingFile=new File([blob],'detect_'+stamp()+'.'+(type.includes('mp4')?'mp4':'webm'),{type});
    saveMsg.textContent='Видео '+pad(Math.floor(sec/60))+':'+pad(sec%60)+' · '+(blob.size/1048576).toFixed(1)+' МБ';
    save.hidden=false;
  };
  recorder.start();
  recStart=performance.now();
  recT.textContent='00:00';
  record.classList.add('live');record.textContent='Стоп';rec.hidden=false;flip.disabled=true;
  recTick=setInterval(()=>{const s=Math.floor((performance.now()-recStart)/1000);recT.textContent=pad(Math.floor(s/60))+':'+pad(s%60);},250);
}
function stopRec(){
  if(!recorder||recorder.state==='inactive'||stopping)return;
  stopping=true;record.disabled=true;
  setTimeout(()=>{if(recorder&&recorder.state!=='inactive')recorder.stop();},300);
}
record.addEventListener('click',()=>{if(recorder)stopRec();else startRec();});
saveBtn.addEventListener('click',async()=>{
  if(!pendingFile)return;
  if(await deliver(pendingFile))hideSave();
});
discardBtn.addEventListener('click',hideSave);

flip.addEventListener('click',async()=>{
  flip.disabled=true;
  const prev=facing;
  facing=facing==='environment'?'user':'environment';
  try{await openCamera();}
  catch(e){
    facing=prev;
    try{await openCamera();}catch(e2){toast('Ошибка камеры: '+errText(e2));}
  }
  flip.disabled=false;
});

if(/MiuiBrowser/i.test(navigator.userAgent))msg.textContent+=' Лучше открыть эту страницу в Chrome.';

go.addEventListener('click',async()=>{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    msg.textContent='Браузер не даёт доступ к камере. Страницу нужно открыть по адресу https://';
    return;
  }
  go.disabled=true;
  try{
    msg.textContent='Включаю камеру…';
    await openCamera();
  }catch(e){
    msg.textContent='Камера: '+errText(e);
    go.disabled=false;
    return;
  }
  startScreen.hidden=true;top.hidden=false;bar.hidden=false;
  running=true;lastFrame=fpsT=performance.now();
  keepAwake();
  render();
  toast('Загружаю нейросеть…',0);
  try{
    detector=await createDetector();
    toast('Нейросеть готова · '+LABEL[kind],1500);
    detectLoop();
  }catch(e){
    toast('Не удалось загрузить нейросеть: '+errText(e)+'. Проверьте интернет и откройте страницу заново.',0);
  }
});

document.addEventListener('visibilitychange',()=>{
  if(!running)return;
  if(document.hidden){stopRec();return;}
  keepAwake();
  video.play().catch(()=>{});
  setTimeout(()=>{
    if(!running||document.hidden)return;
    const t=stream&&stream.getVideoTracks()[0];
    if(!t||t.readyState==='ended'||t.muted)openCamera().catch(e=>toast('Ошибка камеры: '+errText(e)));
  },1000);
});
</script>
