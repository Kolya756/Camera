<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#000000">
<title>Камера-детектор</title>
<style>
html,body{margin:0;height:100%;background:#000;color:#fff;font-family:-apple-system,system-ui,Segoe UI,Roboto,sans-serif;overflow:hidden;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
[hidden]{display:none!important}
#stage{position:fixed;inset:0}
#c{width:100%;height:100%;object-fit:contain;display:block}
video{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}
#flash{position:fixed;inset:0;background:#fff;opacity:0;pointer-events:none;transition:opacity .25s}
#top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);left:calc(env(safe-area-inset-left,0px) + 12px);right:calc(env(safe-area-inset-right,0px) + 12px);display:flex;justify-content:space-between;align-items:flex-start;gap:10px;pointer-events:none}
#hud{font:600 13px ui-monospace,Menlo,Consolas,monospace;color:#39ff7a;text-shadow:0 1px 3px #000;line-height:1.5;white-space:nowrap;min-width:0;flex:1 1 auto;overflow:hidden}
#hud div{overflow:hidden;text-overflow:ellipsis}
#modes{display:flex;background:rgba(15,15,15,.72);border:1px solid rgba(255,255,255,.3);border-radius:999px;padding:3px;pointer-events:auto;flex-shrink:0}
#modes button{background:transparent;border:0;color:#fff;border-radius:999px;padding:7px 12px;font:600 13px -apple-system,system-ui,Segoe UI,Roboto,sans-serif;touch-action:manipulation;cursor:pointer}
#modes button.on{background:#39ff7a;color:#000}
#rec{position:fixed;top:calc(env(safe-area-inset-top,0px) + 58px);right:calc(env(safe-area-inset-right,0px) + 14px);display:flex;align-items:center;gap:7px;font:700 13px ui-monospace,Menlo,Consolas,monospace;color:#ff4d4d;text-shadow:0 1px 3px #000;pointer-events:none}
#rec i{width:10px;height:10px;border-radius:50%;background:#ff4d4d;animation:blink 1s infinite}
@keyframes blink{50%{opacity:.2}}
#bar{position:fixed;bottom:calc(env(safe-area-inset-bottom,0px) + 16px);left:0;right:0;display:flex;justify-content:center;align-items:center;gap:14px;padding:0 12px}
.btn{background:rgba(15,15,15,.72);color:#fff;border:1px solid rgba(255,255,255,.35);border-radius:999px;padding:12px 18px;font:600 15px -apple-system,system-ui,Segoe UI,Roboto,sans-serif;cursor:pointer;touch-action:manipulation;white-space:nowrap}
.btn:disabled{opacity:.45}
#record{min-width:96px}
#record.live{background:#ff4d4d;border-color:#ff4d4d}
#shot{width:68px;height:68px;border-radius:50%;background:#fff;border:4px solid rgba(0,0,0,.55);box-shadow:0 0 0 3px rgba(255,255,255,.85);padding:0}
#shot:active{transform:scale(.92)}
#save{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom,0px) + 96px);transform:translateX(-50%);background:rgba(15,15,15,.9);border:1px solid rgba(255,255,255,.3);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px;max-width:calc(100% - 24px)}
#save span{font-size:14px;white-space:nowrap}
#save .btn{padding:10px 14px}
#toast{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);background:rgba(15,15,15,.88);border:1px solid rgba(255,255,255,.3);border-radius:12px;padding:12px 16px;font-size:14px;max-width:80%;text-align:center;pointer-events:none;line-height:1.4}
#start{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;background:#000;text-align:center;padding:24px}
#start h1{margin:0;font:700 22px ui-monospace,Menlo,Consolas,monospace;color:#39ff7a;letter-spacing:.04em}
#msg{opacity:.8;font-size:14px;max-width:320px;line-height:1.45}
</style>
</head>
<body>
<div id="stage"><canvas id="c"></canvas></div>
<video id="v" playsinline muted autoplay></video>
<div id="flash"></div>
<div id="top" hidden>
<div id="hud"><div id="cnt"></div><div id="perf"></div></div>
<div id="modes"><button data-mode="person" class="on">Люди</button><button data-mode="animal">Животные</button><button data-mode="all">Все</button></div>
</div>
<div id="rec" hidden><i></i><span id="recT">00:00</span></div>
<div id="bar" hidden><button id="record" class="btn">Запись</button><button id="shot" class="btn" aria-label="Фото"></button><button id="flip" class="btn">Сменить</button></div>
<div id="save" hidden><span id="saveMsg"></span><button id="saveBtn" class="btn">Сохранить</button><button id="discardBtn" class="btn">✕</button></div>
<div id="toast" hidden></div>
<div id="start">
<h1>DETECT CAM</h1>
<div id="msg">Камера находит людей и животных и обводит каждого рамкой. Фото и видео сохраняются вместе с рамками.</div>
<button id="go" class="btn">Включить камеру</button>
</div>
<script type="module">
const ORT='https://cdn.jsdelivr.net/npm/onnxruntime-web@1.31.1/dist/';
const SIZES=[640,512];
let SIZE=640;
const MVER='v2';
const SLOW_MS=300;
function modelUrl(s){return new URL('model_'+s+'.onnx',location.href).href;}
const COCO=['person','bicycle','car','motorcycle','airplane','bus','train','truck','boat','traffic light','fire hydrant','stop sign','parking meter','bench','bird','cat','dog','horse','sheep','cow','elephant','bear','zebra','giraffe','backpack','umbrella','handbag','tie','suitcase','frisbee','skis','snowboard','sports ball','kite','baseball bat','baseball glove','skateboard','surfboard','tennis racket','bottle','wine glass','cup','fork','knife','spoon','bowl','banana','apple','sandwich','orange','broccoli','carrot','hot dog','pizza','donut','cake','chair','couch','potted plant','bed','dining table','toilet','tv','laptop','mouse','remote','keyboard','cell phone','microwave','oven','toaster','sink','refrigerator','book','clock','vase','scissors','teddy bear','hair drier','toothbrush'];
const ANIMALS=['bird','cat','dog','horse','sheep','cow','elephant','bear','zebra','giraffe'];
const CLASSES=['person',...ANIMALS];
const RU={person:'ЧЕЛОВЕК',bird:'ПТИЦА',cat:'КОШКА',dog:'СОБАКА',horse:'ЛОШАДЬ',sheep:'ОВЦА',cow:'КОРОВА',elephant:'СЛОН',bear:'МЕДВЕДЬ',zebra:'ЗЕБРА',giraffe:'ЖИРАФ'};
const KEEP_SCORE=0.3;
const LABEL={wgpu:'GPU',wcpu:'CPU',main:'CPU·',fake:'TEST'};
const AFTER={wgpu:['wcpu','main'],wcpu:['main'],main:[],fake:[]};
const WANT=COCO.map(c=>CLASSES.includes(c)?c:'');
const IOS=/iPhone|iPad|iPod/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);

const $=id=>document.getElementById(id);
const video=$('v'),canvas=$('c'),ctx=canvas.getContext('2d');
const top=$('top'),cnt=$('cnt'),perf=$('perf'),modes=$('modes'),rec=$('rec'),recT=$('recT');
const bar=$('bar'),record=$('record'),shot=$('shot'),flip=$('flip');
const save=$('save'),saveMsg=$('saveMsg'),saveBtn=$('saveBtn'),discardBtn=$('discardBtn');
const toastEl=$('toast'),flash=$('flash'),startScreen=$('start'),msg=$('msg'),go=$('go');
const fc=document.createElement('canvas');
const fctx=fc.getContext('2d',{willReadFrequently:true});
const gc=document.createElement('canvas');
const gctx=gc.getContext('2d',{willReadFrequently:true});
const clean=document.createElement('canvas');
const cctx=clean.getContext('2d',{willReadFrequently:true});

let stream=null,facing='environment',mode='person',running=false;
let detectors=[],kind='';
const POOL=Math.max(1,Math.min(3,parseInt(new URLSearchParams(location.search).get('workers'))||((IOS||(navigator.hardwareConcurrency||2)>=4)?2:1)));
let lastTs=0,inferMs=0,cleanTs=0;
let fps=0,fpsN=0,fpsT=0,lastFrame=0;
let toastTimer=null;

try{const m=localStorage.getItem('mode');if(m==='person'||m==='animal'||m==='all')mode=m;const f=localStorage.getItem('facing');if(f==='user'||f==='environment')facing=f;}catch(e){}

const YOLO_LIB=`
function iou(a,b){const x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]),x2=Math.min(a[0]+a[2],b[0]+b[2]),y2=Math.min(a[1]+a[3],b[1]+b[3]);const i=Math.max(0,x2-x1)*Math.max(0,y2-y1);const u=a[2]*a[3]+b[2]*b[3]-i;return u>0?i/u:0;}
function nms(dets,thr){dets.sort((a,b)=>b.score-a.score);const out=[];for(const d of dets){let ok=true;for(const o of out){if(o.cls===d.cls&&iou(o.box,d.box)>thr){ok=false;break;}}if(ok)out.push(d);}return out;}
function decode(out,names,thr,size){
  const o=out[Object.keys(out)[0]];const rows=o.dims[1],N=o.dims[2],d=o.data;const dets=[];
  for(let i=0;i<N;i++){
    let best=-1,bs=0;
    for(let k=4;k<rows;k++){const v=d[k*N+i];if(v>bs){bs=v;best=k-4;}}
    if(bs<thr||!names[best])continue;
    const cx=d[i],cy=d[N+i],w=d[2*N+i],h=d[3*N+i];
    dets.push({cls:names[best],score:bs,box:[cx-w/2,cy-h/2,w,h]});
  }
  return nms(dets,0.45);
}
function tensor(px,size){const n=size*size;const f=new Float32Array(3*n);for(let i=0,j=0;i<n;i++,j+=4){f[i]=px[j]/255;f[n+i]=px[j+1]/255;f[2*n+i]=px[j+2]/255;}return f;}`;

const WORKER_SRC=`
importScripts('${ORT}ort.webgpu.min.js');
ort.env.wasm.wasmPaths='${ORT}';
ort.env.wasm.numThreads=1;
${YOLO_LIB}
let session=null,names=null,size=0,input='';
self.onmessage=async e=>{
  const m=e.data;
  if(m.type==='init'){
    try{
      names=m.names;size=m.size;
      session=await ort.InferenceSession.create(m.model,{executionProviders:m.eps});
      input=session.inputNames[0];
      self.postMessage({type:'ready'});
    }catch(err){self.postMessage({type:'error',message:String(err&&err.message||err)});}
    return;
  }
  if(m.type==='frame'){
    try{
      const t0=performance.now();
      const out=await session.run({[input]:new ort.Tensor('float32',tensor(new Uint8ClampedArray(m.buf),size),[1,3,size,size])});
      self.postMessage({type:'result',dets:decode(out,names,${KEEP_SCORE},size),ms:performance.now()-t0});
    }catch(err){self.postMessage({type:'error',message:String(err&&err.message||err)});}
  }
};`;

function workerDetector(eps,size){
  return new Promise((resolve,reject)=>{
    const url=URL.createObjectURL(new Blob([WORKER_SRC],{type:'text/javascript'}));
    let w;
    try{w=new Worker(url);}catch(e){reject(e);return;}
    let pending=null,ready=false;
    const fail=err=>{w.terminate();if(pending){const p=pending;pending=null;p.reject(err);}if(!ready)reject(err);};
    const timer=setTimeout(()=>fail(new Error('время ожидания вышло')),180000);
    w.onerror=ev=>{clearTimeout(timer);fail(new Error(ev.message||'ошибка воркера'));};
    w.onmessage=ev=>{
      const m=ev.data;
      if(m.type==='ready'){
        clearTimeout(timer);ready=true;
        resolve({
          detect(img,ts){return new Promise((res,rej)=>{pending={resolve:res,reject:rej};w.postMessage({type:'frame',buf:img.data.buffer,ts},[img.data.buffer]);});},
          close(){w.terminate();}
        });
      }else if(m.type==='result'){
        if(pending){const p=pending;pending=null;p.resolve(m);}
      }else if(m.type==='error'){
        clearTimeout(timer);fail(new Error(m.message));
      }
    };
    w.postMessage({type:'init',model:modelUrl(size),eps,names:WANT,size});
  });
}

async function mainDetector(size){
  const ort=await import(ORT+'ort.min.mjs');
  ort.env.wasm.wasmPaths=ORT;
  ort.env.wasm.numThreads=1;
  const lib=new Function(YOLO_LIB+';return {decode,tensor};')();
  const session=await ort.InferenceSession.create(modelUrl(size),{executionProviders:['wasm']});
  const input=session.inputNames[0];
  return {
    async detect(img){
      const t0=performance.now();
      const out=await session.run({[input]:new ort.Tensor('float32',lib.tensor(img.data,size),[1,3,size,size])});
      return {dets:lib.decode(out,WANT,KEEP_SCORE,size),ms:performance.now()-t0};
    },
    close(){session.release();}
  };
}

const KINDS={wgpu:s=>workerDetector(['webgpu','wasm'],s),wcpu:s=>workerDetector(['wasm'],s),main:s=>mainDetector(s)};

function withTimeout(p,ms){return Promise.race([p,new Promise((_,rej)=>setTimeout(()=>rej(new Error('время ожидания вышло')),ms))]);}

async function videoReady(){while(!(video.readyState>=2&&video.videoWidth))await sleep(50);}

async function measure(d){
  await videoReady();
  for(let i=0;i<2;i++)await withTimeout(d.detect(grabFrame().img,nextTs()),30000);
  const t=[];
  for(let i=0;i<3;i++){const t0=performance.now();await withTimeout(d.detect(grabFrame().img,nextTs()),20000);t.push(performance.now()-t0);}
  t.sort((a,b)=>a-b);
  return t[1];
}

async function createDetector(){
  const fake=new URLSearchParams(location.search).get('fakedet');
  if(fake!==null&&window.__fakeDets){
    kind='fake';
    return {async detect(){await sleep(parseInt(fake)||250);return {dets:window.__fakeDets(clean,SIZE),ms:parseInt(fake)||250};},close(){}};
  }
  const params=new URLSearchParams(location.search);
  const forcedSize=SIZES.includes(parseInt(params.get('size')))?parseInt(params.get('size')):0;
  const force=params.get('backend');
  if(force&&KINDS[force]){kind=force;SIZE=forcedSize||SIZES[0];return KINDS[force](SIZE);}
  let saved=null;
  try{saved=JSON.parse(localStorage.getItem('backend')||'null');}catch(e){}
  if(!forcedSize&&saved&&saved.ver===MVER&&KINDS[saved.kind]&&SIZES.includes(saved.size)){
    SIZE=saved.size;
    try{const d=await KINDS[saved.kind](SIZE);kind=saved.kind;return d;}catch(e){}
  }
  SIZE=forcedSize||SIZES[0];
  const tries=navigator.gpu?['wgpu','wcpu']:['wcpu'];
  const res=await Promise.allSettled(tries.map(k=>KINDS[k](SIZE)));
  const cands=[];
  res.forEach((r,i)=>{if(r.status==='fulfilled')cands.push({kind:tries[i],d:r.value,ms:Infinity});});
  if(!cands.length){const d=await KINDS.main(SIZE);kind='main';return d;}
  toast('Подбираю режим работы…',0);
  let best=null;
  for(const c of cands){
    try{c.ms=await measure(c.d);}catch(e){c.ms=Infinity;}
    if(!best||c.ms<best.ms)best=c;
  }
  for(const c of cands)if(c!==best)c.d.close();
  if(best.ms===Infinity){best.d.close();const d=await KINDS.main(SIZE);kind='main';return d;}
  kind=best.kind;
  if(!forcedSize&&best.ms>SLOW_MS&&SIZE!==SIZES[SIZES.length-1]){
    const big=SIZE;
    try{
      SIZE=SIZES[SIZES.length-1];
      const d2=await KINDS[kind](SIZE);
      let ms2=Infinity;
      try{ms2=await measure(d2);}catch(e){}
      if(ms2<best.ms*0.85){best.d.close();best={kind,d:d2,ms:ms2};}
      else{d2.close();SIZE=big;}
    }catch(e){SIZE=big;}
  }
  try{localStorage.setItem('backend',JSON.stringify({kind,size:SIZE,ver:MVER}));}catch(e){}
  return best.d;
}

async function fallbackDetector(){
  for(const d of detectors){try{d.close();}catch(e){}}
  detectors=[];
  try{localStorage.removeItem('backend');}catch(e){}
  for(const k of AFTER[kind]||[]){
    try{const d=await KINDS[k](SIZE);kind=k;detectors=[d];return d;}catch(e){}
  }
  throw new Error('нейросеть недоступна');
}

function addWorkers(){
  if(kind==='main'||kind==='fake')return;
  for(let i=detectors.length;i<POOL;i++){
    KINDS[kind](SIZE).then(d=>{if(running&&detectors.length&&detectors.length<POOL){detectors.push(d);detectLoop(d);}else d.close();}).catch(()=>{});
  }
}

function errText(e){return e&&e.message?e.message:String(e);}
function pad(n){return String(n).padStart(2,'0');}
function stamp(){const d=new Date();return d.getFullYear()+pad(d.getMonth()+1)+pad(d.getDate())+'_'+pad(d.getHours())+pad(d.getMinutes())+pad(d.getSeconds());}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}
function nextTs(){let ts=performance.now();if(ts<=lastTs)ts=lastTs+1;lastTs=ts;return ts;}
function toast(text,ms){
  clearTimeout(toastTimer);
  toastEl.textContent=text;toastEl.hidden=false;
  if(ms!==0)toastTimer=setTimeout(()=>{toastEl.hidden=true;},ms||2500);
}

function gum(c){return withTimeout(navigator.mediaDevices.getUserMedia({audio:false,video:c}),10000);}

async function openCamera(){
  if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}
  video.srcObject=null;
  const base={width:{ideal:1280},height:{ideal:720},frameRate:{ideal:30}};
  try{stream=await gum({...base,facingMode:{exact:facing}});}
  catch(e){
    try{stream=await gum({...base,facingMode:facing});}
    catch(e2){stream=await gum(true);}
  }
  const s=stream;
  s.getVideoTracks().forEach(t=>t.addEventListener('ended',()=>{if(running&&stream===s)openCamera().catch(e=>toast('Ошибка камеры: '+errText(e)));}));
  video.srcObject=stream;
  await video.play();
  if(!video.videoWidth){await Promise.race([new Promise(r=>video.addEventListener('loadedmetadata',r,{once:true})),sleep(4000)]);}
  tracker.reset();
  try{localStorage.setItem('facing',facing);}catch(e){}
}

function grabFrame(){
  const vw=clean.width||2,vh=clean.height||2;
  if(fc.width!==SIZE){fc.width=SIZE;fc.height=SIZE;fctx.imageSmoothingQuality='low';}
  const r=Math.min(SIZE/vw,SIZE/vh);
  const nw=Math.round(vw*r),nh=Math.round(vh*r);
  const px=Math.round((SIZE-nw)/2),py=Math.round((SIZE-nh)/2);
  fctx.fillStyle='rgb(114,114,114)';fctx.fillRect(0,0,SIZE,SIZE);
  fctx.drawImage(clean,0,0,vw,vh,px,py,nw,nh);
  return {img:fctx.getImageData(0,0,SIZE,SIZE),r,px,py,vw,vh};
}
function unbox(d,g){
  let x=(d.box[0]-g.px)/g.r,y=(d.box[1]-g.py)/g.r,w=d.box[2]/g.r,h=d.box[3]/g.r;
  if(x<0){w+=x;x=0;}if(y<0){h+=y;y=0;}
  w=Math.min(g.vw-x,w);h=Math.min(g.vh-y,h);
  return {cls:d.cls,score:d.score,box:[x,y,w,h]};
}

function createTracker(o){
  const P={keep:0.3,fresh:0.45,show:0.35,sure:0.7,matchIou:0.25,ttl:900,confirm:2,contain:0.9,partIn:0.7,partAccept:4,tau:60,histMs:1500,globalR:6,trackR:3,...o};
  const T={tracks:[],nextId:1,frames:[],w:0,h:0,scale:1};

  function interArea(a,b){
    const x1=Math.max(a[0],b[0]),y1=Math.max(a[1],b[1]);
    const x2=Math.min(a[0]+a[2],b[0]+b[2]),y2=Math.min(a[1]+a[3],b[1]+b[3]);
    return Math.max(0,x2-x1)*Math.max(0,y2-y1);
  }
  function iou(a,b){const i=interArea(a,b);const u=a[2]*a[3]+b[2]*b[3]-i;return u>0?i/u:0;}
  function inside(a,b){const aa=a[2]*a[3];return aa>0?interArea(a,b)/aa:0;}

  function sad(prev,cur,w,x,y,bw,bh,dx,dy,st){
    let s=0;
    for(let j=0;j<bh;j+=st){
      const r0=(y+j)*w+x,r1=(y+j+dy)*w+x+dx;
      for(let i=0;i<bw;i+=st)s+=Math.abs(prev[r0+i]-cur[r1+i]);
    }
    return s;
  }
  function texture(g,w,x,y,bw,bh,st){
    let n=0,sum=0;
    for(let j=0;j<bh;j+=st){const r=(y+j)*w+x;for(let i=0;i<bw;i+=st){sum+=g[r+i];n++;}}
    const m=sum/n;let d=0;
    for(let j=0;j<bh;j+=st){const r=(y+j)*w+x;for(let i=0;i<bw;i+=st)d+=Math.abs(g[r+i]-m);}
    return d/n;
  }
  function sub(a,b,c){const d=2*Math.max(a-b,c-b);return d>0?Math.max(-1,Math.min(1,(a-c)/d)):0;}

  function match(prev,cur,w,h,x,y,bw,bh,cx,cy,R,st){
    x=Math.round(x);y=Math.round(y);bw=Math.round(bw);bh=Math.round(bh);
    const lim=R+Math.max(Math.abs(cx),Math.abs(cy));
    if(x<lim){bw-=lim-x;x=lim;}
    if(y<lim){bh-=lim-y;y=lim;}
    if(x+bw>w-lim)bw=w-lim-x;
    if(y+bh>h-lim)bh=h-lim-y;
    if(bw<4||bh<4)return null;
    if(texture(prev,w,x,y,bw,bh,st)<2.5)return null;
    const n=2*R+1,S=new Float64Array(n*n);
    let best=Infinity,bi=0,bj=0;
    for(let j=-R;j<=R;j++)for(let i=-R;i<=R;i++){
      const v=sad(prev,cur,w,x,y,bw,bh,cx+i,cy+j,st);
      S[(j+R)*n+(i+R)]=v;
      if(v<best){best=v;bi=i;bj=j;}
    }
    let fx=0,fy=0;
    const c=(bj+R)*n+(bi+R);
    if(bi>-R&&bi<R)fx=sub(S[c-1],S[c],S[c+1]);
    if(bj>-R&&bj<R)fy=sub(S[c-n],S[c],S[c+n]);
    return {dx:cx+bi+fx,dy:cy+bj+fy,sad:best};
  }

  function region(b){
    const s=T.scale;
    const bw=b[2]*0.6/s,bh=b[3]*0.8/s;
    const a=bw*bh;
    return {x:(b[0]+b[2]*0.2)/s,y:(b[1]+b[3]*0.1)/s,bw,bh,st:a>6000?3:a>1500?2:1};
  }

  function radius(base,dt,cap){return Math.min(cap,Math.max(base,Math.ceil(base*dt/33)));}

  function half(g,w,h){
    const w2=w>>1,h2=h>>1,o=new Uint8Array(w2*h2);
    for(let y=0;y<h2;y++){const r0=2*y*w,r1=r0+w;for(let x=0;x<w2;x++){const i=2*x;o[y*w2+x]=(g[r0+i]+g[r0+i+1]+g[r1+i]+g[r1+i+1])>>2;}}
    return o;
  }

  function global(prev,cur,w,h,dt){
    const w2=w>>1,h2=h>>1;
    const R2=radius(4,dt,10);
    const c=match(prev.g2,cur.g2,w2,h2,R2,R2,w2-2*R2,h2-2*R2,0,0,R2,2);
    const cx=c?Math.round(c.dx*2):0,cy=c?Math.round(c.dy*2):0;
    const lim=2+Math.max(Math.abs(cx),Math.abs(cy));
    const f=match(prev.g,cur.g,w,h,lim,lim,w-2*lim,h-2*lim,cx,cy,2,3);
    return f?[f.dx,f.dy]:(c?[c.dx*2,c.dy*2]:[0,0]);
  }

  function step(prev,cur,b,gdx,gdy,vx,vy){
    const r=region(b);
    const R=radius(P.trackR,cur.t-prev.t,8);
    const cands=[[Math.round(gdx),Math.round(gdy)]];
    for(const c of [[0,0],[Math.round(vx||0),Math.round(vy||0)]]){
      if(cands.every(k=>k[0]!==c[0]||k[1]!==c[1]))cands.push(c);
    }
    let best=null;
    for(const c of cands){
      const m=match(prev.g,cur.g,T.w,T.h,r.x,r.y,r.bw,r.bh,c[0],c[1],R,r.st);
      if(m&&(!best||m.sad<best.sad))best=m;
    }
    const s=T.scale;
    return best?[best.dx*s,best.dy*s]:[gdx*s,gdy*s];
  }

  function motionStep(gray,w,h,scale,now){
    if(w!==T.w||h!==T.h||scale!==T.scale){T.frames=[];T.w=w;T.h=h;T.scale=scale;}
    const prev=T.frames[T.frames.length-1];
    const cur={t:now,g:gray,g2:half(gray,w,h),gdx:0,gdy:0};
    if(prev){
      const g=global(prev,cur,w,h,now-prev.t);
      cur.gdx=g[0];cur.gdy=g[1];
      for(const t of T.tracks){
        const lh=t.hist[t.hist.length-1];
        const [dx,dy]=step(prev,cur,t.pos,cur.gdx,cur.gdy,lh?lh.dx/T.scale:0,lh?lh.dy/T.scale:0);
        t.pos[0]+=dx;t.pos[1]+=dy;t.box[0]+=dx;t.box[1]+=dy;
        t.hist.push({t:now,dx,dy});
        while(t.hist.length&&t.hist[0].t<now-P.histMs)t.hist.shift();
      }
    }
    T.frames.push(cur);
    while(T.frames.length&&T.frames[0].t<now-P.histMs)T.frames.shift();
  }

  function replay(box,ts){
    const f=T.frames;
    let i=0;
    while(i<f.length&&f[i].t<ts-10)i++;
    const b=box.slice();
    let vx=0,vy=0;
    for(;i+1<f.length;i++){
      const [dx,dy]=step(f[i],f[i+1],b,f[i+1].gdx,f[i+1].gdy,vx,vy);
      b[0]+=dx;b[1]+=dy;vx=dx/T.scale;vy=dy/T.scale;
    }
    return b;
  }

  function sumSince(h,ts){
    let dx=0,dy=0;
    for(let i=h.length-1;i>=0&&h[i].t>ts;i--){dx+=h[i].dx;dy+=h[i].dy;}
    return [dx,dy];
  }
  function posAt(t,ts){const [dx,dy]=sumSince(t.hist,ts);return [t.pos[0]-dx,t.pos[1]-dy,t.pos[2],t.pos[3]];}

  function suppress(dets){
    dets.sort((a,b)=>b.score-a.score);
    const out=[];
    for(const d of dets){
      const ad=d.box[2]*d.box[3];
      if(ad<=0)continue;
      let keep=true;
      for(let i=0;i<out.length;i++){
        const o=out[i];
        if(o.cls!==d.cls)continue;
        const ao=o.box[2]*o.box[3];
        if(ad<=ao){if(inside(d.box,o.box)>=P.contain){keep=false;break;}}
        else if(inside(o.box,d.box)>=P.contain&&d.score>=P.keep){out.splice(i,1);i--;}
      }
      if(keep)out.push(d);
    }
    return out;
  }

  function adopt(t,d,ts,now){
    const nb=d.now||(d.now=replay(d.box,ts));
    for(let k=0;k<4;k++)t.pos[k]=t.pos[k]*0.3+nb[k]*0.7;
    t.tDet=ts;t.score=t.score*0.6+d.score*0.4;t.hits++;t.miss=0;t.lastSeen=now;t.part=0;
  }

  function update(dets,ts,now){
    dets=suppress(dets.filter(d=>d.score>=P.keep));
    const tr=T.tracks;
    const at=tr.map(t=>posAt(t,ts));
    const usedT=new Set(),usedD=new Set();
    const pairs=[];
    tr.forEach((t,i)=>dets.forEach((d,j)=>{if(d.cls!==t.cls)return;const v=iou(at[i],d.box);if(v>=P.matchIou)pairs.push([v,i,j]);}));
    pairs.sort((a,b)=>b[0]-a[0]);
    for(const [,i,j] of pairs){
      if(usedT.has(i)||usedD.has(j))continue;
      usedT.add(i);usedD.add(j);adopt(tr[i],dets[j],ts,now);
    }
    dets.forEach((d,j)=>{
      if(usedD.has(j))return;
      d.now=replay(d.box,ts);
      let bi=-1,bv=0;
      tr.forEach((t,i)=>{if(usedT.has(i)||t.cls!==d.cls)return;const v=iou(t.pos,d.now);if(v>=P.matchIou&&v>bv){bv=v;bi=i;}});
      if(bi>=0){usedT.add(bi);usedD.add(j);adopt(tr[bi],d,ts,now);}
    });
    dets.forEach((d,j)=>{
      if(usedD.has(j))return;
      let bi=-1,bv=0;
      tr.forEach((t,i)=>{if(usedT.has(i)||t.cls!==d.cls)return;const v=Math.max(inside(at[i],d.box),inside(t.pos,d.now));if(v>=P.partIn&&v>bv){bv=v;bi=i;}});
      if(bi>=0){usedT.add(bi);usedD.add(j);adopt(tr[bi],d,ts,now);}
    });
    dets.forEach((d,j)=>{
      if(usedD.has(j))return;
      let bi=-1,bv=0;
      tr.forEach((t,i)=>{if(usedT.has(i)||t.cls!==d.cls)return;const v=Math.max(inside(d.box,at[i]),inside(d.now,t.pos));if(v>=P.partIn&&v>bv){bv=v;bi=i;}});
      if(bi<0)return;
      const t=tr[bi];usedT.add(bi);usedD.add(j);
      t.part++;
      if(t.part>=P.partAccept)adopt(t,d,ts,now);
      else{t.tDet=ts;t.miss=0;t.lastSeen=now;t.hits++;t.score=Math.max(t.score*0.9,d.score);}
    });
    tr.forEach((t,i)=>{if(!usedT.has(i)){t.miss++;t.score*=0.9;}});
    dets.forEach((d,j)=>{
      if(usedD.has(j)||d.score<P.fresh)return;
      for(const t of tr)if(t.cls===d.cls&&inside(d.now,t.pos)>=P.partIn)return;
      tr.push({id:T.nextId++,cls:d.cls,pos:d.now.slice(),box:d.now.slice(),hist:[],tDet:ts,score:d.score,hits:1,miss:0,part:0,lastSeen:now});
    });
    T.tracks=tr.filter(t=>{
      const fw=T.w*T.scale,fh=T.h*T.scale;
      const vis=fw&&fh?inside(t.pos,[0,0,fw,fh]):1;
      return now-t.lastSeen<=(vis<0.5?P.ttl*0.35:P.ttl);
    });
  }

  function smooth(now,dt){
    const a=1-Math.exp(-dt/P.tau);
    for(const t of T.tracks)for(let k=0;k<4;k++)t.box[k]+=(t.pos[k]-t.box[k])*a;
  }
  function visible(t){return t.score>=P.show&&(t.hits>=P.confirm||t.score>=P.sure);}
  function reset(){T.tracks=[];T.frames=[];}
  return {P,T,motionStep,update,smooth,visible,reset,match,step,get tracks(){return T.tracks;}};
}
const tracker=createTracker({});
if(new URLSearchParams(location.search).has('debug')){window.__tracker=tracker;window.__clean=clean;}

async function detectLoop(det){
  while(running&&detectors.includes(det)){
    if(!(video.readyState>=2&&video.videoWidth&&clean.width>2)){await sleep(50);continue;}
    const g=grabFrame();
    const ts=cleanTs;
    try{
      const r=await det.detect(g.img,ts);
      const now=performance.now();
      inferMs=inferMs?inferMs*0.8+r.ms*0.2:r.ms;
      tracker.update(r.dets.map(d=>unbox(d,g)).filter(d=>d.box[2]>1&&d.box[3]>1),ts,now);
    }catch(e){
      const i=detectors.indexOf(det);
      if(i>=0)detectors.splice(i,1);
      try{det.close();}catch(e2){}
      if(detectors.length)return;
      toast('Переключаю нейросеть…',0);
      try{const d=await fallbackDetector();inferMs=0;toast('Нейросеть: '+LABEL[kind],1500);detectLoop(d);}
      catch(e2){if(running)toast('Нейросеть остановилась: '+errText(e)+'. Откройте страницу заново.',0);}
      return;
    }
  }
}

function visible(t){
  if(!tracker.visible(t))return false;
  if(mode==='person')return t.cls==='person';
  if(mode==='animal')return t.cls!=='person';
  return true;
}

function drawBox(x,y,w,h,t){
  const s=Math.max(1,canvas.width/640);
  const color=t.miss>1?'#ffcc33':(t.cls==='person'?'#39ff7a':'#3ad7ff');
  ctx.strokeStyle=color;
  ctx.globalAlpha=0.55;
  ctx.lineWidth=1.5*s;
  ctx.strokeRect(x,y,w,h);
  ctx.globalAlpha=1;
  const L=Math.min(w,h)*0.22;
  ctx.lineWidth=4*s;
  ctx.lineCap='square';
  ctx.beginPath();
  ctx.moveTo(x,y+L);ctx.lineTo(x,y);ctx.lineTo(x+L,y);
  ctx.moveTo(x+w-L,y);ctx.lineTo(x+w,y);ctx.lineTo(x+w,y+L);
  ctx.moveTo(x+w,y+h-L);ctx.lineTo(x+w,y+h);ctx.lineTo(x+w-L,y+h);
  ctx.moveTo(x+L,y+h);ctx.lineTo(x,y+h);ctx.lineTo(x,y+h-L);
  ctx.stroke();
  const label=(RU[t.cls]||t.cls.toUpperCase())+' #'+t.id+'  '+Math.round(t.score*100)+'%';
  ctx.font='600 '+(14*s)+'px ui-monospace,Menlo,Consolas,monospace';
  const tw=ctx.measureText(label).width+12*s;
  const th=22*s;
  const ly=y-th-4*s<0?y+4*s:y-th-4*s;
  ctx.fillStyle='rgba(0,0,0,0.6)';
  ctx.fillRect(x,ly,tw,th);
  ctx.fillStyle=color;
  ctx.textBaseline='middle';
  ctx.fillText(label,x+6*s,ly+th/2);
}

function render(){
  if(!running)return;
  requestAnimationFrame(render);
  const vw=video.videoWidth,vh=video.videoHeight;
  if(!vw||!vh)return;
  if(canvas.width!==vw||canvas.height!==vh){canvas.width=vw;canvas.height=vh;}
  const now=performance.now();
  const dt=Math.min(100,now-lastFrame);lastFrame=now;
  const mirror=facing==='user';
  if(clean.width!==vw||clean.height!==vh){clean.width=vw;clean.height=vh;}
  cctx.drawImage(video,0,0,vw,vh);
  cleanTs=now;
  ctx.save();
  if(mirror){ctx.translate(vw,0);ctx.scale(-1,1);}
  ctx.drawImage(clean,0,0,vw,vh);
  ctx.restore();
  const sw=Math.max(16,Math.round(vw/8)),sh=Math.max(9,Math.round(vh/8));
  if(gc.width!==sw||gc.height!==sh){gc.width=sw;gc.height=sh;gctx.imageSmoothingEnabled=true;gctx.imageSmoothingQuality='high';}
  gctx.drawImage(clean,0,0,sw,sh);
  const px=gctx.getImageData(0,0,sw,sh).data;
  const gray=new Uint8Array(sw*sh);
  for(let i=0,j=0;i<gray.length;i++,j+=4)gray[i]=(px[j]*77+px[j+1]*150+px[j+2]*29)>>8;
  tracker.motionStep(gray,sw,sh,vw/sw,now);
  tracker.smooth(now,dt);
  let nP=0,nA=0;
  for(const t of tracker.tracks){
    if(!visible(t))continue;
    if(t.cls==='person')nP++;else nA++;
    let [x,y,w,h]=t.box;
    if(mirror)x=vw-x-w;
    drawBox(x,y,w,h,t);
  }
  fpsN++;
  if(now-fpsT>=1000){fps=fpsN*1000/(now-fpsT);fpsN=0;fpsT=now;}
  cnt.textContent=mode==='person'?'ЛЮДЕЙ: '+nP:mode==='animal'?'ЖИВОТНЫХ: '+nA:'ЛЮДЕЙ: '+nP+'  ЖИВОТНЫХ: '+nA;
  perf.textContent=Math.round(fps)+' FPS'+(detectors.length?' · '+Math.round(inferMs)+'мс · '+LABEL[kind]+(detectors.length>1?'×'+detectors.length:'')+'·'+SIZE:' · загрузка…');
}

function setMode(m){
  mode=m;
  for(const b of modes.children)b.classList.toggle('on',b.dataset.mode===m);
  try{localStorage.setItem('mode',m);}catch(e){}
}
modes.addEventListener('click',e=>{const b=e.target.closest('button');if(b)setMode(b.dataset.mode);});
setMode(mode);

async function keepAwake(){
  try{if('wakeLock' in navigator)await navigator.wakeLock.request('screen');}catch(e){}
}

async function deliver(file,url){
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file]});return true;}
    catch(e){if(e&&e.name==='AbortError')return false;}
  }
  const href=url||URL.createObjectURL(file);
  const a=document.createElement('a');
  a.href=href;a.download=file.name;a.rel='noopener';
  document.body.appendChild(a);a.click();
  setTimeout(()=>{a.remove();if(!url)URL.revokeObjectURL(href);},60000);
  toast('Сохранено: '+file.name);
  return true;
}

function dataUrlToFile(u,name,type){
  const b=atob(u.slice(u.indexOf(',')+1));
  const arr=new Uint8Array(b.length);
  for(let i=0;i<b.length;i++)arr[i]=b.charCodeAt(i);
  return new File([arr],name,{type});
}

shot.addEventListener('click',()=>{
  if(!running||!canvas.width)return;
  flash.style.opacity='0.85';
  setTimeout(()=>{flash.style.opacity='0';},70);
  const dataUrl=canvas.toDataURL('image/jpeg',0.92);
  const file=dataUrlToFile(dataUrl,'detect_'+stamp()+'.jpg','image/jpeg');
  deliver(file,dataUrl);
});

let recorder=null,recChunks=[],recStream=null,recStart=0,recTick=null,pendingFile=null,stopping=false;
function pickMime(){
  if(typeof MediaRecorder==='undefined')return null;
  for(const t of ['video/mp4;codecs=avc1.42E01E','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'])if(MediaRecorder.isTypeSupported(t))return t;
  return '';
}
function hideSave(){save.hidden=true;pendingFile=null;}
function startRec(){
  const mime=pickMime();
  if(mime===null||!canvas.captureStream){toast('Этот браузер не умеет записывать видео');return;}
  hideSave();
  try{
    recStream=canvas.captureStream(30);
    const opts={videoBitsPerSecond:4000000};
    if(mime)opts.mimeType=mime;
    recorder=new MediaRecorder(recStream,opts);
  }catch(e){
    if(recStream){recStream.getTracks().forEach(t=>t.stop());recStream=null;}
    recorder=null;toast('Запись не поддерживается: '+errText(e));return;
  }
  recChunks=[];
  recorder.ondataavailable=e=>{if(e.data&&e.data.size)recChunks.push(e.data);};
  recorder.onerror=()=>{if(recorder&&recorder.state!=='inactive'){toast('Ошибка записи');stopRec();}};
  recorder.onstop=()=>{
    const type=(recorder.mimeType||mime||'video/webm').split(';')[0];
    const blob=new Blob(recChunks,{type});
    recChunks=[];
    recStream.getTracks().forEach(t=>t.stop());recStream=null;recorder=null;stopping=false;
    clearInterval(recTick);
    record.classList.remove('live');record.textContent='Запись';record.disabled=false;rec.hidden=true;flip.disabled=false;
    const sec=Math.round((performance.now()-recStart)/1000);
    if(blob.size<2000||sec<1){toast('Видео не записалось');return;}
    pendingFile=new File([blob],'detect_'+stamp()+'.'+(type.includes('mp4')?'mp4':'webm'),{type});
    saveMsg.textContent='Видео '+pad(Math.floor(sec/60))+':'+pad(sec%60)+' · '+(blob.size/1048576).toFixed(1)+' МБ';
    save.hidden=false;
  };
  recorder.start();
  recStart=performance.now();
  recT.textContent='00:00';
  record.classList.add('live');record.textContent='Стоп';rec.hidden=false;flip.disabled=true;
  recTick=setInterval(()=>{const s=Math.floor((performance.now()-recStart)/1000);recT.textContent=pad(Math.floor(s/60))+':'+pad(s%60);},250);
}
function stopRec(){
  if(!recorder||recorder.state==='inactive'||stopping)return;
  stopping=true;record.disabled=true;
  setTimeout(()=>{if(recorder&&recorder.state!=='inactive')recorder.stop();},300);
}
record.addEventListener('click',()=>{if(recorder)stopRec();else startRec();});
saveBtn.addEventListener('click',async()=>{
  if(!pendingFile)return;
  if(await deliver(pendingFile))hideSave();
});
discardBtn.addEventListener('click',hideSave);

flip.addEventListener('click',async()=>{
  flip.disabled=true;
  const prev=facing;
  facing=facing==='environment'?'user':'environment';
  try{await openCamera();}
  catch(e){
    facing=prev;
    try{await openCamera();}catch(e2){toast('Ошибка камеры: '+errText(e2));}
  }
  flip.disabled=false;
});

if(/MiuiBrowser/i.test(navigator.userAgent))msg.textContent+=' Лучше открыть эту страницу в Chrome.';

go.addEventListener('click',async()=>{
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    msg.textContent='Браузер не даёт доступ к камере. Страницу нужно открыть по адресу https://';
    return;
  }
  go.disabled=true;
  try{
    msg.textContent='Включаю камеру…';
    await openCamera();
  }catch(e){
    msg.textContent='Камера: '+errText(e);
    go.disabled=false;
    return;
  }
  startScreen.hidden=true;top.hidden=false;bar.hidden=false;
  running=true;lastFrame=fpsT=performance.now();
  keepAwake();
  render();
  toast('Загружаю нейросеть…',0);
  try{
    const d=await createDetector();
    detectors=[d];
    toast('Нейросеть готова · '+LABEL[kind],1500);
    detectLoop(d);
    addWorkers();
  }catch(e){
    toast('Не удалось загрузить нейросеть: '+errText(e)+'. Проверьте интернет и откройте страницу заново.',0);
  }
});

document.addEventListener('visibilitychange',()=>{
  if(!running)return;
  if(document.hidden){stopRec();return;}
  keepAwake();
  video.play().catch(()=>{});
  setTimeout(()=>{
    if(!running||document.hidden)return;
    const t=stream&&stream.getVideoTracks()[0];
    if(!t||t.readyState==='ended'||t.muted)openCamera().catch(e=>toast('Ошибка камеры: '+errText(e)));
  },1000);
});
</script>
